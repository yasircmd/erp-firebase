<div class="space-y-6">
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-4">
    <div><div class="text-xs font-semibold text-blue-400 uppercase mb-1">Stock Management</div><h2 class="text-2xl font-bold"><i class="fa-solid fa-ruler text-blue-500"></i> Unit of Measure</h2></div>
    <button id="uom-add-btn" class="hidden bg-blue-600 hover:bg-blue-500 text-white font-medium px-4 py-2 rounded-lg text-sm"><i class="fa-solid fa-plus"></i> Add Unit</button>
  </div>

  <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-left">
        <thead><tr class="bg-slate-900 border-b border-slate-700 text-xs text-slate-400 uppercase">
          <th class="py-3 px-4">Code</th><th class="py-3 px-4">Name</th><th class="py-3 px-4">Decimals</th><th class="py-3 px-4">Status</th><th class="py-3 px-4 text-right">Actions</th>
        </tr></thead>
        <tbody id="uom-table-body" class="divide-y divide-slate-700 text-sm"></tbody>
      </table>
    </div>
  </div>
</div>

<div id="uom-modal" class="fixed inset-0 bg-slate-950/80 hidden flex items-center justify-center p-4 z-50">
  <div class="bg-slate-800 border border-slate-700 rounded-xl w-full max-w-md p-6 shadow-2xl space-y-5">
    <div class="flex items-center justify-between border-b border-slate-700 pb-3"><h3 id="uom-modal-title" class="text-lg font-bold">Add Unit</h3><button id="uom-modal-close" class="text-slate-400 hover:text-slate-200"><i class="fa-solid fa-xmark text-lg"></i></button></div>
    <form id="uom-form" class="space-y-4">
      <input type="hidden" id="uom-form-id">
      <div><label class="block text-xs font-medium text-slate-300 mb-1">Code</label><input type="text" id="uom-form-code" required maxlength="8" placeholder="e.g. KG" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm uppercase focus:outline-none focus:border-blue-500"></div>
      <div><label class="block text-xs font-medium text-slate-300 mb-1">Name</label><input type="text" id="uom-form-name" required placeholder="e.g. Kilogram" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm focus:outline-none focus:border-blue-500"></div>
      <div class="grid grid-cols-2 gap-4 items-end">
        <div class="flex items-center gap-2 bg-slate-900/60 border border-slate-700 rounded-lg py-2 px-3 h-[38px]">
          <input type="checkbox" id="uom-form-decimals" class="w-4 h-4">
          <label for="uom-form-decimals" class="text-xs text-slate-300">Allow decimals</label>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Decimal places</label>
          <input type="number" id="uom-form-decimalplaces" min="0" max="6" step="1" value="2" disabled class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm disabled:opacity-40">
        </div>
      </div>
      <div><label class="block text-xs font-medium text-slate-300 mb-1">Status</label><select id="uom-form-status" required class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm"><option value="Active">Active</option><option value="Inactive">Inactive</option></select></div>
      <div id="uom-form-error" class="hidden text-xs text-red-400 bg-red-500/10 border border-red-500/20 p-2.5 rounded-lg text-center"></div>
      <div class="flex justify-end gap-3 pt-3 border-t border-slate-700">
        <button type="button" id="uom-modal-cancel" class="px-4 py-2 bg-slate-700 rounded-lg text-xs">Cancel</button>
        <button type="submit" id="uom-save-btn" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded-lg text-xs text-white"><i class="fa-solid fa-floppy-disk"></i> Save Unit</button>
      </div>
    </form>
  </div>
</div>

<script>
(function () {
  let token = '';
  let canWrite = false;
  let uoms = [];

  function escapeHtml(value) {
    const div = document.createElement('div');
    div.textContent = value == null ? '' : String(value);
    return div.innerHTML;
  }

  function fetchAndRender() {
    rpc
      .withSuccessHandler(result => { uoms = result || []; renderTable(); })
      .withFailureHandler(err => alert(err.message || 'Unable to load units.'))
      .getUOMs();
  }

  function renderTable() {
    const tbody = document.getElementById('uom-table-body');
    tbody.innerHTML = '';
    if (!uoms.length) { tbody.innerHTML = '<tr><td colspan="5" class="py-6 text-center text-slate-500">No units configured yet.</td></tr>'; return; }

    uoms.sort((a, b) => a.Code.localeCompare(b.Code)).forEach(u => {
      const row = document.createElement('tr'); row.className = 'hover:bg-slate-800/40';
      const actions = canWrite
        ? `<button class="uom-edit text-slate-400 hover:text-blue-400 p-1" title="Edit"><i class="fa-solid fa-pen-to-square"></i></button>
           <button class="uom-toggle text-slate-400 ${u.Status === 'Active' ? 'hover:text-red-400' : 'hover:text-emerald-400'} p-1" title="${u.Status === 'Active' ? 'Deactivate' : 'Reactivate'}"><i class="fa-solid ${u.Status === 'Active' ? 'fa-ban' : 'fa-rotate-left'}"></i></button>`
        : '';
      row.innerHTML = `
        <td class="py-3 px-4 font-mono text-xs text-slate-200">${escapeHtml(u.Code)}</td>
        <td class="py-3 px-4 text-slate-200">${escapeHtml(u.Name)}</td>
        <td class="py-3 px-4 text-xs text-slate-400">${u.AllowDecimals ? u.DecimalPlaces + ' dp' : 'Whole numbers only'}</td>
        <td class="py-3 px-4 text-xs">${u.Status === 'Active' ? '<span class="text-emerald-400">Active</span>' : '<span class="text-slate-500">Inactive</span>'}</td>
        <td class="py-3 px-4 text-right">${actions}</td>`;
      if (canWrite) {
        row.querySelector('.uom-edit').addEventListener('click', () => openModal(u.UOMID));
        row.querySelector('.uom-toggle').addEventListener('click', () => toggleStatus(u));
      }
      tbody.appendChild(row);
    });
  }

  function updateDecimalPlacesEnabled() {
    document.getElementById('uom-form-decimalplaces').disabled = !document.getElementById('uom-form-decimals').checked;
  }

  function openModal(uomId) {
    const form = document.getElementById('uom-form');
    form.reset();
    document.getElementById('uom-form-error').classList.add('hidden');
    if (uomId) {
      const u = uoms.find(item => item.UOMID === uomId);
      if (!u) return;
      document.getElementById('uom-modal-title').textContent = 'Edit Unit';
      document.getElementById('uom-form-id').value = u.UOMID;
      document.getElementById('uom-form-code').value = u.Code;
      document.getElementById('uom-form-name').value = u.Name;
      document.getElementById('uom-form-decimals').checked = Boolean(u.AllowDecimals);
      document.getElementById('uom-form-decimalplaces').value = u.DecimalPlaces || 2;
      document.getElementById('uom-form-status').value = u.Status;
    } else {
      document.getElementById('uom-modal-title').textContent = 'Add Unit';
      document.getElementById('uom-form-id').value = '';
      document.getElementById('uom-form-decimalplaces').value = 2;
    }
    updateDecimalPlacesEnabled();
    document.getElementById('uom-modal').classList.remove('hidden');
  }

  function closeModal() { document.getElementById('uom-modal').classList.add('hidden'); }

  function saveUOM(event) {
    event.preventDefault();
    const data = {
      UOMID: document.getElementById('uom-form-id').value,
      Code: document.getElementById('uom-form-code').value.trim(),
      Name: document.getElementById('uom-form-name').value.trim(),
      AllowDecimals: document.getElementById('uom-form-decimals').checked,
      DecimalPlaces: document.getElementById('uom-form-decimalplaces').value,
      Status: document.getElementById('uom-form-status').value
    };
    const error = document.getElementById('uom-form-error');
    const btn = document.getElementById('uom-save-btn');
    error.classList.add('hidden');
    btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> Saving...';
    rpc
      .withSuccessHandler(result => {
        btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Save Unit';
        if (result.success) { closeModal(); fetchAndRender(); }
        else { error.textContent = result.error || 'Unable to save unit.'; error.classList.remove('hidden'); }
      })
      .withFailureHandler(err => {
        btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Save Unit';
        error.textContent = err.message || 'Unable to save unit.'; error.classList.remove('hidden');
      })
      .saveUOM({ uomData: data });
  }

  function toggleStatus(uom) {
    const deactivating = uom.Status === 'Active';
    if (!confirm((deactivating ? 'Deactivate' : 'Reactivate') + ' ' + uom.Code + '?')) return;
    const call = deactivating ? 'deactivateUOM' : 'reactivateUOM';
    rpc
      .withSuccessHandler(result => { if (result.success) fetchAndRender(); else alert(result.error || 'Unable to update unit.'); })
      .withFailureHandler(err => alert(err.message || 'Unable to update unit.'))
      [call]({ uomId: uom.UOMID });
  }

  // Single entry point called by Index.html after this fragment is injected.
  window.initModule = function (idToken, writeAllowed) {
    token = idToken;
    canWrite = Boolean(writeAllowed);

    document.getElementById('uom-add-btn').classList.toggle('hidden', !canWrite);
    if (canWrite) document.getElementById('uom-add-btn').addEventListener('click', () => openModal());
    document.getElementById('uom-modal-close').addEventListener('click', closeModal);
    document.getElementById('uom-modal-cancel').addEventListener('click', closeModal);
    document.getElementById('uom-form').addEventListener('submit', saveUOM);
    document.getElementById('uom-form-decimals').addEventListener('change', updateDecimalPlacesEnabled);

    document.getElementById('app-title').innerHTML = '<i class="fa-solid fa-ruler"></i> Unit of Measure';
    fetchAndRender();
  };
})();
</script>
