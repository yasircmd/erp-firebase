# Production deploys for erp1-8f4cd from GitHub, without Cloud Shell. Runs the
# same tools/ scripts on a clean checkout. Manual only: GitHub → Actions →
# "Deploy" → Run workflow (choose the branch). Never runs on push.
#
# Needs one repository secret, GCP_SA_KEY: the JSON key of a Google Cloud
# service account with Firebase Admin, Cloud Functions Admin, Cloud Run Admin
# (for the public-invoker binding) and Service Account User.
# Record every run in docs/DEPLOY_LOG.md afterwards, as with Cloud Shell deploys.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'What to deploy'
        type: choice
        options:
          - functions set                 # tools/deploy-functions.sh <set>
          - functions set, then screens   # tools/deploy-functions.sh <set> --screens
          - access, then screens          # tools/deploy-functions.sh <set> --access-only --screens: after "IAM FAILED", without redeploying
          - screens only                  # tools/release-screens.sh
          - runtime                       # tools/deploy-runtime.sh
          - database rules                # tools/deploy-rules.sh (RTDB + Firestore rules)
          - hosting                       # tools/deploy-hosting.sh (public/index.html, the app shell; public/ess.html, the Employee Portal; public/help/, the Help)
        default: functions set
      set:
        description: 'Deploy set name, from tools/deploy-sets/ without .txt (for the "functions set" tasks)'
        required: false
        default: ''
      confirm:
        description: 'Type DEPLOY to confirm a production deploy'
        required: true

# One deploy at a time; a second run waits rather than racing the first.
concurrency:
  group: deploy-erp1-8f4cd
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Pinned: ubuntu-latest becomes Ubuntu 26 from 2026-10-19 (GitHub notice).
    # Move deliberately, after a harmless run on the new image.
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 180
    steps:
      - name: Check confirmation, branch and inputs
        env:
          TASK: ${{ inputs.task }}
          SET: ${{ inputs.set }}
        run: |
          [ "${{ inputs.confirm }}" = "DEPLOY" ] || { echo "Type DEPLOY in the confirm box to run a production deploy."; exit 1; }
          [ "${{ github.ref_name }}" = "main" ] || { echo "Deploys run only from main (got ${{ github.ref_name }})."; exit 1; }
          case "$TASK" in
            "functions set"*) [[ "$SET" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "Give a deploy set name (a file in tools/deploy-sets/)."; exit 1; } ;;
          esac

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: functions/package.json   # engines.node
          # No dependency cache in a workflow holding production credentials
          # (setup-node's own advice since v5, which caches automatically).
          package-manager-cache: false

      - name: Install dependencies
        run: |
          (cd functions && npm ci)
          (cd tools/legacy-port && npm ci)
          npm install -g firebase-tools

      # The generated code must be exactly what the generator produces from the
      # committed Apps Script snapshot and patches; a hand edit fails here.
      - name: Check generated code is up to date
        run: |
          node tools/legacy-port/generate.js legacy-gas
          # screens/ too: the generator writes the ported modules' screens, so a
          # hand edit to one is undone here and the release then stops on a
          # "working copy not clean" (run #133, 2026-10-11). Change those screens
          # through SCREEN_EDITS in tools/legacy-port/generate.js.
          git diff --exit-code -- functions/src/legacy functions/modules screens

      # Messages, confirmations and questions are shown in the app, never as
      # browser popups (owner, 2026-09-29): a screen that uses confirm() or
      # prompt() doesn't deploy.
      - name: Check no browser popups
        run: node --test functions/test/unit/noBrowserDialogs.test.js

      # Dates show dd/mm/yyyy (owner, 2026-09-29): the shell formats them; a
      # screen that formats dates its own way doesn't deploy.
      - name: Check date format
        run: node --test functions/test/unit/dateFormat.test.js

      # Help follows the ERP (owner, 2026-10-12; docs/modules/HELP.md, decision
      # 149): a module with no help area, a written area's module with no page,
      # a page behind its module's code (update it, or confirm it, with
      # node tools/help/stamp.js <page>) or a public/help/ not built from the
      # pages stops every deploy.
      - name: Check help
        run: node --test functions/test/unit/help.test.js

      # tools/screen-release.js records who released (git config user.name);
      # the runner has no git identity, so use the person who started the run.
      # Repo-local config, not a working-copy change: the clean-copy check still passes.
      - name: Record who is deploying
        run: |
          git config user.name "${{ github.actor }} (GitHub Actions)"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Deploy
        env:
          TASK: ${{ inputs.task }}
          SET: ${{ inputs.set }}
          # 20 hit Cloud Functions API errors in practice (docs/ROADMAP.md, 2026-09-26); 6 goes through.
          BATCH: '6'
        run: |
          case "$TASK" in
            "functions set")               bash tools/deploy-functions.sh "$SET" ;;
            "functions set, then screens") bash tools/deploy-functions.sh "$SET" --screens ;;
            "access, then screens")        bash tools/deploy-functions.sh "$SET" --access-only --screens ;;
            "screens only")                bash tools/release-screens.sh ;;
            "runtime")                     bash tools/deploy-runtime.sh ;;
            "database rules")              bash tools/deploy-rules.sh ;;
            "hosting")                     bash tools/deploy-hosting.sh ;;
          esac

      # A functions deploy without screens (owner, 2026-10-02: runs #40 and
      # #43 left changed screens unreleased): warn, on the run's summary,
      # when screens/ on main differs from the active release. Nothing is
      # undone; the fix is a "screens only" run.
      - name: Check screens are released
        if: inputs.task == 'functions set'
        run: |
          set +e
          out=$(bash tools/release-screens.sh compare 2>&1); code=$?
          set -e
          echo "$out"
          if [ $code -eq 3 ]; then
            list=$(echo "$out" | grep -E '^  (changed|new|no longer)' | sed 's/^  //' | paste -sd ';' - | sed 's/;/; /g')
            echo "::warning title=Screens not released::The functions are deployed, but screens changed on main are not live ($list). Run Deploy again with \"screens only\"."
            {
              echo "## ⚠️ Screens not released"
              echo "The functions are deployed, but these screens on main differ from the live release:"
              echo
              echo "$out" | grep -E '^  ' | sed 's/^  /- /'
              echo
              echo "Users still see the old screens until you run **Deploy → \"screens only\"**."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ $code -ne 0 ]; then
            echo "::warning title=Screen check failed::Could not compare screens with the active release (see this step's log). The functions deploy itself succeeded."
          else
            echo "## ✅ Screens: the live release matches main" >> "$GITHUB_STEP_SUMMARY"
          fi
