<style>
  @media print {
    #back-to-tree-btn, #tree-controls, #user-menu, .no-print { display: none !important; }
    body, #app-container { background: white !important; color: black !important; }
  }
</style>

<div class="space-y-6">
  <div class="flex items-center justify-between border-b border-slate-800 pb-4 no-print">
    <div><div class="text-xs font-semibold text-blue-400 uppercase mb-1">Stock Reports</div><h2 class="text-2xl font-bold"><i class="fa-solid fa-layer-group text-blue-500"></i> Production &amp; Consumption Report</h2></div>
    <button id="pc-print-btn" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded border border-slate-700"><i class="fa-solid fa-print"></i> Print</button>
  </div>

  <div class="bg-slate-800/60 border border-slate-700 rounded-xl p-4 space-y-3 no-print">
    <div class="flex gap-2">
      <button id="pc-type-production" class="pc-type-btn flex-1 py-2 rounded-lg text-sm font-medium border">Production</button>
      <button id="pc-type-consumption" class="pc-type-btn flex-1 py-2 rounded-lg text-sm font-medium border">Consumption</button>
    </div>
    <p id="pc-type-note" class="text-xs text-slate-500"></p>

    <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
      <div><label class="block text-xs font-medium text-slate-300 mb-1">Company</label><select id="pc-company" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm"><option value="">Select...</option></select></div>
      <div><label class="block text-xs font-medium text-slate-300 mb-1">Category <span class="text-slate-500">(optional)</span></label><select id="pc-category" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm"><option value="">All</option></select></div>
      <div><label class="block text-xs font-medium text-slate-300 mb-1">Sub-Category <span class="text-slate-500">(optional)</span></label><select id="pc-subcategory" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm"><option value="">All</option></select></div>
      <div></div>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
      <div><label class="block text-xs font-medium text-slate-300 mb-1">From</label><input type="date" id="pc-from-date" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm"></div>
      <div><label class="block text-xs font-medium text-slate-300 mb-1">To</label><input type="date" id="pc-to-date" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm"></div>
      <div class="md:col-span-2 flex items-end gap-2">
        <button id="pc-copy-btn" class="bg-slate-700 hover:bg-slate-600 text-xs px-4 py-2 rounded-lg"><i class="fa-solid fa-copy"></i> Copy Table</button>
        <button id="pc-run-btn" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-4 py-2 rounded-lg font-medium">Run Report</button>
      </div>
    </div>
  </div>

  <div id="pc-error" class="hidden text-xs text-red-400 bg-red-500/10 border border-red-500/20 p-2.5 rounded-lg"></div>

  <div id="pc-results" class="hidden space-y-3">
    <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left">
          <thead>
            <tr class="bg-slate-900 border-b border-slate-700 text-xs text-slate-400 uppercase">
              <th class="py-3 px-4">Item</th>
              <th class="py-3 px-4 text-right">Quantity</th>
              <th class="py-3 px-4 text-right">Value</th>
            </tr>
          </thead>
          <tbody id="pc-table-body" class="divide-y divide-slate-700 text-sm"></tbody>
          <tfoot>
            <tr class="bg-slate-900 border-t border-slate-700 font-medium text-sm">
              <td class="py-2 px-4" colspan="2">Grand Total (value)</td>
              <td class="py-2 px-4 text-right font-mono" id="pc-grand-total"></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>
    <p id="pc-empty-note" class="hidden text-sm text-slate-500 text-center py-4">Nothing matching these filters in this period.</p>
  </div>
</div>

<script>
(function () {
  let token = '';
  let companies = [];
  let subCategories = [];
  let reportType = 'Production';
  let lastReport = null;

  function escapeHtml(value) {
    const div = document.createElement('div');
    div.textContent = value == null ? '' : String(value);
    return div.innerHTML;
  }
  function formatMoney(n) {
    const num = Number(n) || 0;
    return num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function fmt(n) { return (Number(n) || 0).toFixed(2); }
  function today() { return new Date().toISOString().substring(0, 10); }
  function firstOfMonth() { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1).toISOString().substring(0, 10); }

  // Matches Item Master's actual category list (ITEMMASTER.html) — kept
  // in sync manually, same approach as Stock Valuation Report's own
  // category dropdown.
  const CATEGORIES = [
    { value: 'RawMaterial', label: 'Raw Material' },
    { value: 'SemiFinishedGood', label: 'Semi-Finished Good' },
    { value: 'FinishedGood', label: 'Finished Good' },
    { value: 'Consumable', label: 'Consumable' },
    { value: 'Scrap', label: 'Scrap' }
  ];

  function setReportType(type) {
    reportType = type;
    const prodBtn = document.getElementById('pc-type-production');
    const consBtn = document.getElementById('pc-type-consumption');
    prodBtn.className = 'pc-type-btn flex-1 py-2 rounded-lg text-sm font-medium border ' + (type === 'Production' ? 'bg-blue-600 border-blue-500 text-white' : 'bg-slate-900 border-slate-700 text-slate-400');
    consBtn.className = 'pc-type-btn flex-1 py-2 rounded-lg text-sm font-medium border ' + (type === 'Consumption' ? 'bg-blue-600 border-blue-500 text-white' : 'bg-slate-900 border-slate-700 text-slate-400');
    document.getElementById('pc-type-note').textContent = type === 'Production'
      ? 'Total quantity produced (from Production Entry), grouped by category.'
      : 'Net material consumed — Material Issue, Stock Adjustment, and Physical Count combined, grouped by category.';
  }

  function populateCategorySelect() {
    const select = document.getElementById('pc-category');
    CATEGORIES.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.value; opt.textContent = c.label;
      select.appendChild(opt);
    });
  }

  function populateSubCategorySelect() {
    const categoryFilter = document.getElementById('pc-category').value;
    const select = document.getElementById('pc-subcategory');
    select.innerHTML = '<option value="">All</option>';
    subCategories
      .filter(sc => !categoryFilter || sc.ParentCategory === categoryFilter)
      .forEach(sc => {
        const opt = document.createElement('option');
        opt.value = sc.SubCategoryID; opt.textContent = sc.Name;
        select.appendChild(opt);
      });
  }

  function loadReferenceData() {
    rpc
      .withSuccessHandler(result => {
        companies = result || [];
        const select = document.getElementById('pc-company');
        select.innerHTML = '<option value="">Select...</option>';
        companies.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.CompanyID; opt.textContent = c.LegalName;
          select.appendChild(opt);
        });
      })
      .withFailureHandler(err => console.error(err))
      .getActiveCompanies();

    rpc
      .withSuccessHandler(result => { subCategories = result || []; populateSubCategorySelect(); })
      .withFailureHandler(err => console.error(err))
      .getActiveItemSubCategories();
  }

  function runReport() {
    const error = document.getElementById('pc-error');
    error.classList.add('hidden');
    document.getElementById('pc-results').classList.add('hidden');

    const companyId = document.getElementById('pc-company').value;
    if (!companyId) { error.textContent = 'Select a Company.'; error.classList.remove('hidden'); return; }
    const fromDate = document.getElementById('pc-from-date').value;
    const toDate = document.getElementById('pc-to-date').value;
    if (!fromDate || !toDate) { error.textContent = 'Select a date range.'; error.classList.remove('hidden'); return; }

    const params = {
      CompanyID: companyId, ReportType: reportType,
      Category: document.getElementById('pc-category').value,
      SubCategoryID: document.getElementById('pc-subcategory').value,
      FromDate: fromDate, ToDate: toDate
    };

    const btn = document.getElementById('pc-run-btn');
    btn.disabled = true; const original = btn.textContent; btn.textContent = 'Running...';
    rpc
      .withSuccessHandler(result => {
        btn.disabled = false; btn.textContent = original;
        lastReport = result;
        renderReport(result);
      })
      .withFailureHandler(err => {
        btn.disabled = false; btn.textContent = original;
        error.textContent = err.message || 'Unable to run report.'; error.classList.remove('hidden');
      })
      .getProductionConsumptionReport({ params: params });
  }

  // Renders the flat, sorted row list with inserted Category/Sub-Category
  // group header rows (each carrying its own value subtotal) whenever
  // the grouping key changes — a lightweight "control break" pattern,
  // not a nested data structure, since the rows already arrive sorted
  // by Category then Sub-Category then Item from the server.
  function renderReport(result) {
    document.getElementById('pc-results').classList.remove('hidden');
    const tbody = document.getElementById('pc-table-body');
    tbody.innerHTML = '';
    document.getElementById('pc-empty-note').classList.toggle('hidden', result.Rows.length > 0);

    let currentCategory = null, currentSubCategory = null;
    let subCategorySubtotal = 0;

    function flushSubCategorySubtotal() {
      if (currentSubCategory === null) return;
      const tr = document.createElement('tr');
      tr.className = 'bg-slate-800/60 font-medium';
      tr.innerHTML = `<td class="py-1.5 px-4 pl-8 text-xs text-slate-400" colspan="2">${escapeHtml(currentSubCategory)} subtotal</td><td class="py-1.5 px-4 text-right text-xs font-mono text-slate-300">${formatMoney(subCategorySubtotal)}</td>`;
      tbody.appendChild(tr);
    }

    result.Rows.forEach(r => {
      if (r.Category !== currentCategory) {
        flushSubCategorySubtotal();
        currentSubCategory = null; subCategorySubtotal = 0;
        currentCategory = r.Category;
        const tr = document.createElement('tr');
        tr.innerHTML = `<td class="py-2 px-4 font-semibold text-slate-200 bg-slate-900/60" colspan="3">${escapeHtml(r.Category)}</td>`;
        tbody.appendChild(tr);
      }
      if (r.SubCategoryName !== currentSubCategory) {
        flushSubCategorySubtotal();
        currentSubCategory = r.SubCategoryName; subCategorySubtotal = 0;
      }
      subCategorySubtotal += r.Value;

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="py-2 px-4 pl-8"><span class="font-mono text-xs text-slate-300">${escapeHtml(r.ItemCode)}</span> <span class="text-slate-400">${escapeHtml(r.ItemName)}</span></td>
        <td class="py-2 px-4 text-right text-xs font-mono">${formatMoney(r.Quantity)} ${escapeHtml(r.UOMCode)}</td>
        <td class="py-2 px-4 text-right text-xs font-mono text-slate-500">${formatMoney(r.Value)}</td>`;
      tbody.appendChild(tr);
    });
    flushSubCategorySubtotal();

    document.getElementById('pc-grand-total').textContent = formatMoney(result.GrandTotalValue);
  }

  async function copyTable() {
    if (!lastReport) { alert('Run the report first.'); return; }
    const rows = [['Category', 'Sub-Category', 'Item Code', 'Item Name', 'Quantity', 'UOM', 'Value'].join('\t')];
    lastReport.Rows.forEach(r => {
      rows.push([r.Category, r.SubCategoryName, r.ItemCode, r.ItemName, fmt(r.Quantity), r.UOMCode, fmt(r.Value)].join('\t'));
    });
    rows.push(['', '', '', '', '', 'Grand Total', fmt(lastReport.GrandTotalValue)].join('\t'));
    const text = rows.join('\n');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(async () => (await appPrompt('Copy this text:', text)));
    } else {
      (await appPrompt('Copy this text:', text));
    }
  }

  window.initModule = function (idToken) {
    token = idToken;
    document.getElementById('pc-from-date').value = firstOfMonth();
    document.getElementById('pc-to-date').value = today();

    populateCategorySelect();
    loadReferenceData();
    setReportType('Production');

    document.getElementById('pc-type-production').addEventListener('click', () => setReportType('Production'));
    document.getElementById('pc-type-consumption').addEventListener('click', () => setReportType('Consumption'));
    document.getElementById('pc-category').addEventListener('change', populateSubCategorySelect);
    document.getElementById('pc-run-btn').addEventListener('click', runReport);
    document.getElementById('pc-copy-btn').addEventListener('click', copyTable);
    document.getElementById('pc-print-btn').addEventListener('click', () => window.print());

    document.getElementById('app-title').innerHTML = '<i class="fa-solid fa-layer-group"></i> Production & Consumption Report';
  };
})();
</script>
