<style>
  @media print {
    #back-to-tree-btn, #tree-controls, #user-menu, .no-print { display: none !important; }
    body, #app-container { background: white !important; color: black !important; }
    #ag-report, #ag-report * { color: black !important; border-color: #999 !important; background: white !important; }
    #ag-report .ag-items { display: none !important; }
  }
  #ag-report table th, #ag-report table td { white-space: nowrap; }
</style>

<div class="space-y-5">
  <div class="flex items-center justify-between border-b border-slate-800 pb-4 no-print">
    <div><div id="ag-kicker" class="text-xs font-semibold text-blue-400 uppercase mb-1">Accounts Receivable</div><h2 class="text-2xl font-bold"><i class="fa-solid fa-hourglass-half text-blue-500"></i> <span id="ag-heading">Customer Aging</span></h2></div>
    <div class="flex gap-2">
      <button id="ag-copy" disabled class="bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-xs px-3 py-1.5 rounded border border-slate-700"><i class="fa-solid fa-copy"></i> Copy</button>
      <button id="ag-print" disabled class="bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-xs px-3 py-1.5 rounded border border-slate-700"><i class="fa-solid fa-print"></i> Print</button>
    </div>
  </div>

  <div class="bg-slate-800/60 border border-slate-700 rounded-xl p-4 space-y-3 no-print">
    <div class="grid grid-cols-2 md:grid-cols-6 gap-3">
      <div class="col-span-2"><label class="block text-xs font-medium text-slate-300 mb-1">Company</label><select id="ag-company" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm"><option value="">Select...</option></select></div>
      <div><label class="block text-xs font-medium text-slate-300 mb-1">As at</label><input type="date" id="ag-asof" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm"></div>
      <div class="col-span-2"><label class="block text-xs font-medium text-slate-300 mb-1">Age by</label><select id="ag-basis" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm">
        <option value="due">Days overdue (from the due date)</option><option value="invoice">Days since the invoice date</option></select></div>
      <div class="flex items-end"><button id="ag-run" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium px-4 py-2 rounded-lg text-sm">Run</button></div>
    </div>
    <div class="flex flex-wrap items-center gap-4 text-xs text-slate-300">
      <input id="ag-search" placeholder="Search name or code" class="bg-slate-900 border border-slate-700 rounded-lg py-1.5 px-3 text-sm w-56">
      <label class="flex items-center gap-2"><input id="ag-overdue" type="checkbox"> Only with something overdue</label>
    </div>
    <div id="ag-error" class="hidden text-xs text-red-400 bg-red-500/10 border border-red-500/20 p-2.5 rounded-lg"></div>
  </div>

  <div id="ag-report" class="hidden space-y-3">
    <div class="flex flex-col md:flex-row md:justify-between gap-1">
      <div><p id="ag-company-name" class="text-xs text-slate-400 uppercase"></p><h3 class="text-lg font-bold" id="ag-title"></h3></div>
      <p id="ag-basis-line" class="text-sm text-slate-300 md:text-right"></p>
    </div>
    <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-x-auto">
      <table class="w-full text-left text-xs">
        <thead><tr id="ag-head" class="bg-slate-900 border-b border-slate-700 text-slate-400 uppercase"></tr></thead>
        <tbody id="ag-body" class="divide-y divide-slate-700"></tbody>
        <tfoot id="ag-foot" class="font-semibold border-t border-slate-600"></tfoot>
      </table>
    </div>
    <p id="ag-control" class="text-xs text-slate-400"></p>
    <p class="text-xs text-slate-500 no-print">Click a row to see its open items; "SOA" opens the statement. Unapplied credits are advances and open credits not matched to an invoice; pending PDCs are shown for information and not deducted.</p>
  </div>
</div>

<script>
(function () {
  // Customer and Vendor Aging share this file: VENDORAGING.html is this file
  // with only the CONFIG block swapped (tools/build-aging-screens.js;
  // docs/modules/AGING_REPORTS.md).
  // CONFIG-START
  const CONFIG = {
    moduleId: 'CUSTOMERAGING', partyType: 'Customer', kicker: 'Accounts Receivable', heading: 'Customer Aging',
    partyLabel: 'Customer', soaModule: 'CUSTOMERSOA'
  };
  // CONFIG-END
  const $ = id => document.getElementById(id);
  const call = (name, data) => new Promise((ok, fail) => rpc.withSuccessHandler(ok).withFailureHandler(fail)[name](data));
  const money = n => (Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const amt = n => Math.abs(n) < 0.005 ? '<span class="text-slate-600">—</span>' : money(n);
  let report = null, open = new Set(), seq = 0; // only the latest Run draws (an older one answering late is dropped)

  function showError(msg) { $('ag-error').textContent = msg || ''; $('ag-error').classList.toggle('hidden', !msg); }
  function rows() {
    const q = $('ag-search').value.trim().toLowerCase();
    const overdueKeys = report.Buckets.map(b => b.key).filter(k => k !== 'notDue');
    return report.Rows.filter(r => (!q || (r.Name + ' ' + r.Code).toLowerCase().includes(q)) &&
      (!$('ag-overdue').checked || (report.Basis === 'due' ? overdueKeys.some(k => r.Buckets[k] > 0.005) : r.Owed > 0.005)));
  }
  function run() {
    showError('');
    const companyId = $('ag-company').value;
    if (!companyId) return showError('Select a Company.');
    $('ag-run').disabled = true;
    const mine = ++seq;
    call('getPartyAging', { partyType: CONFIG.partyType, companyId, asOf: $('ag-asof').value, basis: $('ag-basis').value }).then(r => {
      if (mine !== seq) return;
      report = r; open = new Set(); render();
    }, err => { if (mine === seq) showError(err.message || 'Unable to run the report.'); }).then(() => { if (mine === seq) $('ag-run').disabled = false; });
  }
  function render() {
    const r = report;
    $('ag-report').classList.remove('hidden');
    $('ag-copy').disabled = $('ag-print').disabled = false;
    $('ag-company-name').textContent = $('ag-company').selectedOptions[0].textContent;
    $('ag-title').textContent = CONFIG.heading + ' as at ' + r.AsOf;
    $('ag-basis-line').textContent = r.Basis === 'due' ? 'Aged by days overdue (from the due date)' : 'Aged by days since the invoice date';
    $('ag-head').innerHTML = '<th class="py-2 px-3">' + CONFIG.partyLabel + '</th><th class="py-2 px-3 text-right">Terms</th>' +
      r.Buckets.map(b => '<th class="py-2 px-3 text-right">' + b.label + '</th>').join('') +
      '<th class="py-2 px-3 text-right">Owed</th><th class="py-2 px-3 text-right">Unapplied credits</th><th class="py-2 px-3 text-right">Net balance</th><th class="py-2 px-3 text-right">Pending PDCs</th><th class="no-print"></th>';
    const list = rows();
    const cols = r.Buckets.length + 7;
    $('ag-body').innerHTML = list.map(x => '<tr class="ag-row hover:bg-slate-700/30 cursor-pointer" data-id="' + escapeHtml(x.PartyID) + '">' +
      '<td class="py-1.5 px-3"><i class="fa-solid ' + (open.has(x.PartyID) ? 'fa-chevron-down' : 'fa-chevron-right') + ' text-slate-500 text-[10px] mr-1 no-print"></i>' + escapeHtml(x.Name) + ' <span class="text-slate-500">' + escapeHtml(x.Code) + '</span></td>' +
      '<td class="py-1.5 px-3 text-right">' + x.Terms + '</td>' +
      r.Buckets.map(b => '<td class="py-1.5 px-3 text-right font-mono ag-b-' + b.key + '">' + amt(x.Buckets[b.key]) + '</td>').join('') +
      '<td class="py-1.5 px-3 text-right font-mono">' + amt(x.Owed) + '</td><td class="py-1.5 px-3 text-right font-mono">' + amt(x.Unapplied) + '</td>' +
      '<td class="py-1.5 px-3 text-right font-mono font-semibold ag-net">' + money(x.Net) + (x.Currency ? '<div class="ag-fc text-[11px] font-normal text-amber-300">' + escapeHtml(x.Currency) + ' ' + money(x.FcNet) + '</div>' : '') + '</td><td class="py-1.5 px-3 text-right font-mono text-slate-400">' + amt(x.PendingPdc) + '</td>' +
      '<td class="py-1.5 px-3 no-print"><button class="ag-soa text-blue-300 hover:text-blue-200" data-id="' + escapeHtml(x.PartyID) + '">SOA</button></td></tr>' +
      (open.has(x.PartyID) ? '<tr class="ag-items"><td colspan="' + cols + '" class="px-6 py-2 bg-slate-900/40"><table class="w-full"><thead><tr class="text-slate-500 uppercase"><th class="text-left px-2">Document</th><th class="text-left px-2">Type</th><th class="text-left px-2">Date</th><th class="text-left px-2">Due</th><th class="text-right px-2">Days</th><th class="text-right px-2">Outstanding' + (x.Currency ? ' (' + escapeHtml(x.Currency) + ')</th><th class="text-right px-2">Rate</th><th class="text-right px-2">In ' + escapeHtml(r.BaseCurrency || 'base') : '') + '</th></tr></thead><tbody>' +
        x.Items.map(i => '<tr><td class="px-2 font-mono">' + escapeHtml(i.Number) + '</td><td class="px-2">' + escapeHtml(i.Type) + '</td><td class="px-2">' + escapeHtml(i.Date) + '</td><td class="px-2">' + escapeHtml(i.DueDate) + '</td><td class="px-2 text-right">' + (i.Bucket === 'unapplied' ? '' : i.Age) + '</td><td class="px-2 text-right font-mono">' + money(i.Outstanding) + '</td>' +
          (x.Currency ? '<td class="px-2 text-right font-mono">' + escapeHtml(i.Rate) + '</td><td class="px-2 text-right font-mono">' + money(i.BaseOutstanding) + '</td>' : '') + '</tr>').join('') +
        '</tbody></table></td></tr>' : '')).join('') ||
      '<tr><td colspan="' + cols + '" class="py-6 text-center text-slate-500">Nothing outstanding.</td></tr>';
    const t = r.Totals;
    $('ag-foot').innerHTML = '<tr><td class="py-2 px-3">Total (' + r.Rows.length + ')</td><td></td>' + r.Buckets.map(b => '<td class="py-2 px-3 text-right font-mono">' + money(t.Buckets[b.key]) + '</td>').join('') +
      '<td class="py-2 px-3 text-right font-mono">' + money(t.Owed) + '</td><td class="py-2 px-3 text-right font-mono">' + money(t.Unapplied) + '</td><td id="ag-total-net" class="py-2 px-3 text-right font-mono">' + money(t.Net) + '</td><td class="py-2 px-3 text-right font-mono text-slate-400">' + money(t.PendingPdc) + '</td><td class="no-print"></td></tr>';
    const c = r.Control;
    $('ag-control').innerHTML = c.status === 'ok'
      ? 'Control account' + (c.Accounts.length > 1 ? 's' : '') + ' ' + escapeHtml(c.Accounts.join(', ')) + ' in the GL at ' + escapeHtml(r.AsOf) + ': ' + money(c.Balance) +
        (Math.abs(c.Difference) < 0.005 ? ' <span class="text-emerald-400">— agrees with the report.</span>' : ' <span class="text-amber-300">— differs by ' + money(c.Difference) + ' (entries on the control account without a ' + CONFIG.partyLabel.toLowerCase() + ' tagged).</span>')
      : c.status === 'shared' ? 'The control account is also used by the other kind of party: no GL comparison.' : '';
  }
  // Tab-separated, so a paste into Excel lands each field in its own cell.
  function copy() {
    const r = report;
    const fc = rows().some(x => x.Currency); // a party in a foreign currency: its own net too
    const lines = [[CONFIG.partyLabel, 'Code', 'Terms'].concat(r.Buckets.map(b => b.label), ['Owed', 'Unapplied credits', 'Net balance', 'Pending PDCs'], fc ? ['Currency', 'Net in currency'] : [])]
      .concat(rows().map(x => [x.Name, x.Code, x.Terms].concat(r.Buckets.map(b => x.Buckets[b.key].toFixed(2)), [x.Owed.toFixed(2), x.Unapplied.toFixed(2), x.Net.toFixed(2), x.PendingPdc.toFixed(2)],
        fc ? [x.Currency || '', x.Currency ? x.FcNet.toFixed(2) : ''] : [])));
    const tsv = lines.map(l => l.map(v => String(v).replace(/[\t\n]/g, ' ')).join('\t')).join('\n');
    const done = () => { $('ag-copy').innerHTML = '<i class="fa-solid fa-check"></i> Copied'; setTimeout(() => { const b = $('ag-copy'); if (b) b.innerHTML = '<i class="fa-solid fa-copy"></i> Copy'; }, 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(tsv).then(done, () => appAlert('Unable to copy.'));
    else appAlert('Copying is not available in this browser.');
  }

  window.initModule = function () {
    $('ag-kicker').textContent = CONFIG.kicker;
    $('ag-heading').textContent = CONFIG.heading;
    $('app-title').innerHTML = '<i class="fa-solid fa-hourglass-half"></i> ' + escapeHtml(CONFIG.heading);
    $('ag-asof').value = new Date().toISOString().substring(0, 10);
    call('getActiveCompanies', {}).then(list => {
      (list || []).sort((a, b) => a.LegalName.localeCompare(b.LegalName)).forEach(c => {
        const o = document.createElement('option'); o.value = c.CompanyID; o.textContent = c.LegalName + (c.CompanyRefCode ? ' (' + c.CompanyRefCode + ')' : '');
        $('ag-company').appendChild(o);
      });
      if ($('ag-company').options.length === 2) { $('ag-company').selectedIndex = 1; run(); }
    }, err => showError(err.message || 'Unable to load companies.'));
    $('ag-run').addEventListener('click', run);
    $('ag-basis').addEventListener('change', () => { if (report) run(); });
    ['ag-search', 'ag-overdue'].forEach(id => $(id).addEventListener(id === 'ag-search' ? 'input' : 'change', () => { if (report) render(); }));
    $('ag-copy').addEventListener('click', copy);
    $('ag-print').addEventListener('click', () => window.print());
    $('ag-body').addEventListener('click', e => {
      const soa = e.target.closest('.ag-soa');
      if (soa) {
        e.stopPropagation();
        openModule(CONFIG.soaModule, { companyId: report.CompanyID, partyId: soa.dataset.id, fromDate: report.AsOf.slice(0, 4) + '-01-01', toDate: report.AsOf },
          [{ moduleId: CONFIG.moduleId, label: CONFIG.heading }]);
        return;
      }
      const tr = e.target.closest('tr.ag-row');
      if (!tr) return;
      open.has(tr.dataset.id) ? open.delete(tr.dataset.id) : open.add(tr.dataset.id);
      render();
    });
  };
})();
</script>
