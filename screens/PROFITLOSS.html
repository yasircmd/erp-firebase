<style>
  @media print {
    #back-to-tree-btn, #tree-controls, #user-menu, .no-print { display: none !important; }
    body, #app-container { background: white !important; color: black !important; }
  }
</style>

<div class="space-y-6">
  <div class="flex items-center justify-between border-b border-slate-800 pb-4 no-print">
    <div class="flex items-center gap-3">
      <button id="pl-back-btn" class="hidden bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded border border-slate-700"><i class="fa-solid fa-arrow-left"></i> <span id="pl-back-label">Back</span></button>
      <div><div class="text-xs font-semibold text-blue-400 uppercase mb-1">Financial Reports</div><h2 class="text-2xl font-bold"><i class="fa-solid fa-chart-line text-blue-500"></i> Profit and Loss Statement (P&L)</h2></div>
    </div>
    <button id="pl-print-btn" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded border border-slate-700"><i class="fa-solid fa-print"></i> Print</button>
  </div>

  <div class="bg-slate-800/60 border border-slate-700 rounded-xl p-4 space-y-3 no-print">
    <div class="grid grid-cols-2 md:grid-cols-6 gap-3">
      <div><label class="block text-xs font-medium text-slate-300 mb-1">From</label><input type="date" id="pl-from-date" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm"></div>
      <div><label class="block text-xs font-medium text-slate-300 mb-1">To</label><input type="date" id="pl-to-date" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm"></div>
      <div><label class="block text-xs font-medium text-slate-300 mb-1">Company</label><select id="pl-company" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm"><option value="">All</option></select></div>
      <div><label class="block text-xs font-medium text-slate-300 mb-1">Division</label><select id="pl-division" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm"><option value="">All</option></select></div>
      <div><label class="block text-xs font-medium text-slate-300 mb-1">Branch</label><select id="pl-branch" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm"><option value="">All</option></select></div>
      <div><label class="block text-xs font-medium text-slate-300 mb-1">Cost Center</label><select id="pl-costcenter" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm"><option value="">All</option></select></div>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-6 gap-3">
      <div><label class="block text-xs font-medium text-slate-300 mb-1">Profit Center</label><select id="pl-profitcenter" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm"><option value="">All</option></select></div>
    </div>
    <div class="flex justify-end gap-2">
      <button id="pl-copy-btn" class="bg-slate-700 hover:bg-slate-600 text-xs px-4 py-2 rounded-lg"><i class="fa-solid fa-copy"></i> Copy Table</button>
      <button id="pl-run-btn" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-4 py-2 rounded-lg font-medium">Run Report</button>
    </div>
  </div>

  <div id="pl-error" class="hidden text-xs text-red-400 bg-red-500/10 border border-red-500/20 p-2.5 rounded-lg"></div>

  <div id="pl-results" class="hidden space-y-4">
    <h3 class="text-sm text-slate-400">For the period <span id="pl-period-label" class="text-slate-200 font-medium"></span></h3>

    <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden">
      <table class="w-full text-left">
        <tbody id="pl-table-body" class="divide-y divide-slate-700 text-sm"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
(function () {
  let token = '';
  let orgUnits = [];
  let lastReport = null;
  let lastParams = null;
  let myReturnChain = [];
  let companiesReady = false, orgUnitsReady = false;

  function escapeHtml(value) {
    const div = document.createElement('div');
    div.textContent = value == null ? '' : String(value);
    return div.innerHTML;
  }
  function formatMoney(n) {
    const num = Number(n) || 0;
    return num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function fmt(n) { return (Number(n) || 0).toFixed(2); }
  function today() { return new Date().toISOString().substring(0, 10); }
  function firstOfYear() { return new Date().getFullYear() + '-01-01'; }

  function populateOrgUnitSelect(selectId, type) {
    const select = document.getElementById(selectId);
    select.innerHTML = '<option value="">All</option>';
    orgUnits.filter(u => u.Type === type)
      .sort((a, b) => String(a.Code).localeCompare(String(b.Code), undefined, { numeric: true }))
      .forEach(u => {
        const opt = document.createElement('option');
        opt.value = u.UnitID; opt.textContent = u.Code + ' — ' + u.Name;
        select.appendChild(opt);
      });
  }

  function checkReadyAndApplyPending() {
    if (!companiesReady || !orgUnitsReady) return;
    const p = window.__pendingModuleParams;
    if (!p) return;
    window.__pendingModuleParams = null;

    document.getElementById('pl-from-date').value = p.FromDate || firstOfYear();
    document.getElementById('pl-to-date').value = p.ToDate || today();
    document.getElementById('pl-company').value = p.CompanyID || '';
    document.getElementById('pl-division').value = p.DivisionID || '';
    document.getElementById('pl-branch').value = p.BranchID || '';
    document.getElementById('pl-costcenter').value = p.CostCenterID || '';
    document.getElementById('pl-profitcenter').value = p.ProfitCenterID || '';

    runReport();
  }

  function loadReferenceData() {
    rpc
      .withSuccessHandler(result => {
        const select = document.getElementById('pl-company');
        select.innerHTML = '<option value="">All</option>';
        (result || []).sort((a, b) => a.LegalName.localeCompare(b.LegalName)).forEach(c => {
          const opt = document.createElement('option'); opt.value = c.CompanyID; opt.textContent = c.LegalName;
          select.appendChild(opt);
        });
        companiesReady = true;
        checkReadyAndApplyPending();
      })
      .withFailureHandler(err => console.error(err))
      .getActiveCompanies();

    rpc
      .withSuccessHandler(result => {
        orgUnits = result || [];
        populateOrgUnitSelect('pl-division', 'Division');
        populateOrgUnitSelect('pl-branch', 'Branch');
        populateOrgUnitSelect('pl-costcenter', 'CostCenter');
        populateOrgUnitSelect('pl-profitcenter', 'ProfitCenter');
        orgUnitsReady = true;
        checkReadyAndApplyPending();
      })
      .withFailureHandler(err => console.error(err))
      .getActiveOrgUnits();
  }

  function runReport() {
    const error = document.getElementById('pl-error');
    error.classList.add('hidden');
    document.getElementById('pl-results').classList.add('hidden');

    const params = {
      FromDate: document.getElementById('pl-from-date').value,
      ToDate: document.getElementById('pl-to-date').value,
      CompanyID: document.getElementById('pl-company').value,
      DivisionID: document.getElementById('pl-division').value,
      BranchID: document.getElementById('pl-branch').value,
      CostCenterID: document.getElementById('pl-costcenter').value,
      ProfitCenterID: document.getElementById('pl-profitcenter').value
    };
    lastParams = params;

    const btn = document.getElementById('pl-run-btn');
    btn.disabled = true; const original = btn.textContent; btn.textContent = 'Running...';
    rpc
      .withSuccessHandler(result => {
        btn.disabled = false; btn.textContent = original;
        lastReport = result;
        renderReport(result);
      })
      .withFailureHandler(err => {
        btn.disabled = false; btn.textContent = original;
        error.textContent = err.message || 'Unable to run report.'; error.classList.remove('hidden');
      })
      .getProfitAndLoss({ params: params });
  }

  // Drills into GL Report using lastParams — the EXACT period/filters that
  // produced the currently-displayed Amount, and hands back a return-chain
  // entry so GL Report's "Back" restores this exact view.
  function drillToGl(accountCode) {
    openModule('GLREPORT', {
      AccountCode: accountCode,
      FromDate: lastParams.FromDate,
      ToDate: lastParams.ToDate,
      CompanyID: lastParams.CompanyID,
      DivisionID: lastParams.DivisionID,
      BranchID: lastParams.BranchID,
      CostCenterID: lastParams.CostCenterID,
      ProfitCenterID: lastParams.ProfitCenterID
    }, [...myReturnChain, { moduleId: 'PROFITLOSS', label: 'Profit and Loss Statement', params: lastParams }]);
  }

  function sectionRows(title, accounts, total, colorClass) {
    let html = `<tr class="bg-slate-900/60"><td class="py-2 px-4 font-semibold text-xs text-slate-400 uppercase" colspan="2">${title}</td></tr>`;
    if (!accounts.length) {
      html += `<tr><td class="py-2 px-4 pl-8 text-slate-500 text-sm italic" colspan="2">No activity</td></tr>`;
    }
    accounts.forEach(a => {
      html += `<tr><td class="py-2 px-4 pl-8 text-slate-300 text-sm"><button class="pl-drill-link text-blue-400 hover:underline underline-offset-2" data-code="${escapeHtml(a.AccountCode)}">${escapeHtml(a.AccountCode)} — ${escapeHtml(a.AccountName)}</button></td><td class="py-2 px-4 text-right text-sm">${formatMoney(a.Amount)}</td></tr>`;
    });
    html += `<tr class="border-t border-slate-700"><td class="py-2 px-4 font-medium text-sm ${colorClass}">Total ${title}</td><td class="py-2 px-4 text-right font-medium text-sm ${colorClass}">${formatMoney(total)}</td></tr>`;
    return html;
  }

  function renderReport(result) {
    document.getElementById('pl-results').classList.remove('hidden');
    document.getElementById('pl-period-label').textContent = result.fromDate + ' to ' + result.toDate;

    let html = '';
    html += sectionRows('Revenue', result.revenue, result.totalRevenue, 'text-emerald-400');
    html += sectionRows('Cost of Goods Sold', result.cogs, result.totalCogs, 'text-amber-400');
    html += `<tr class="border-t-2 border-slate-600 bg-slate-900/40"><td class="py-3 px-4 font-bold text-slate-100">Gross Profit</td><td class="py-3 px-4 text-right font-bold text-slate-100">${formatMoney(result.grossProfit)}</td></tr>`;
    html += sectionRows('Expenses', result.expense, result.totalExpense, 'text-amber-400');
    const netClass = result.netIncome >= 0 ? 'text-emerald-400' : 'text-red-400';
    html += `<tr class="border-t-2 border-slate-600 bg-slate-900/60"><td class="py-3 px-4 font-bold text-lg ${netClass}">Net Income</td><td class="py-3 px-4 text-right font-bold text-lg ${netClass}">${formatMoney(result.netIncome)}</td></tr>`;

    document.getElementById('pl-table-body').innerHTML = html;
    document.querySelectorAll('.pl-drill-link').forEach(el => {
      el.addEventListener('click', () => drillToGl(el.getAttribute('data-code')));
    });
  }

  function copyTable() {
    if (!lastReport) { alert('Run the report first.'); return; }
    const rows = [];
    function section(title, accounts, total) {
      rows.push([title, ''].join('\t'));
      accounts.forEach(a => rows.push([a.AccountCode + ' - ' + a.AccountName, fmt(a.Amount)].join('\t')));
      rows.push(['Total ' + title, fmt(total)].join('\t'));
    }
    section('Revenue', lastReport.revenue, lastReport.totalRevenue);
    section('Cost of Goods Sold', lastReport.cogs, lastReport.totalCogs);
    rows.push(['Gross Profit', fmt(lastReport.grossProfit)].join('\t'));
    section('Expenses', lastReport.expense, lastReport.totalExpense);
    rows.push(['Net Income', fmt(lastReport.netIncome)].join('\t'));
    const text = rows.join('\n');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(() => window.prompt('Copy this text:', text));
    } else {
      window.prompt('Copy this text:', text);
    }
  }

  function goBackInChain() {
    const chain = myReturnChain.slice();
    const target = chain.pop();
    if (!target) return;
    openModule(target.moduleId, target.params, chain);
  }

  window.initModule = function (idToken) {
    token = idToken;
    document.getElementById('pl-from-date').value = firstOfYear();
    document.getElementById('pl-to-date').value = today();

    myReturnChain = window.__pendingReturnChain || [];
    window.__pendingReturnChain = [];
    if (myReturnChain.length) {
      const target = myReturnChain[myReturnChain.length - 1];
      document.getElementById('pl-back-label').textContent = 'Back to ' + (target.label || target.moduleId);
      document.getElementById('pl-back-btn').classList.remove('hidden');
      document.getElementById('pl-back-btn').addEventListener('click', goBackInChain);
    }

    loadReferenceData();

    document.getElementById('pl-run-btn').addEventListener('click', runReport);
    document.getElementById('pl-copy-btn').addEventListener('click', copyTable);
    document.getElementById('pl-print-btn').addEventListener('click', () => window.print());

    document.getElementById('app-title').innerHTML = '<i class="fa-solid fa-chart-line"></i> Profit and Loss Statement (P&L)';
  };
})();
</script>
