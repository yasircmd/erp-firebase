<!-- MIS Reports (owner, 2026-11-08; docs/modules/MIS.md, Q427-Q434, phase 3
     Q443-Q445): the report catalogue with its comparisons (previous month,
     the same month last year, year to date, budget): the chart above the
     table (hideable), each figure with its change and %, coloured by whether
     the change is good; Copy (to Excel) and Print take the table; on a phone
     the lines are cards. "My reports": a report saved with its company,
     comparison, chart and month (the latest, or fixed), private or shared
     with roles (MIS publish), the roles seeing it read-only. -->
<style>
  html.phone-view #mis-table thead { display: none; }
  html.phone-view #mis-table tr { display: block; padding: 0.6rem 0.75rem; }
  html.phone-view #mis-table td { display: flex; justify-content: space-between; gap: 1rem; padding: 0.15rem 0 !important; text-align: right; }
  html.phone-view #mis-table td::before { content: attr(data-label); color: #94a3b8; font-size: 0.7rem; text-align: left; }
  html.phone-view #mis-table td:first-child { font-weight: 600; }
  html.phone-view #mis-table td:first-child::before { content: none; }
  @media print { #mis-chart-box { break-inside: avoid; } }
</style>
<div class="space-y-4">
  <div class="flex flex-col md:flex-row md:items-end justify-between gap-3 border-b border-slate-800 pb-3">
    <div><div class="text-xs font-semibold text-blue-400 uppercase mb-1">Management reports</div><h2 class="text-2xl font-bold"><i class="fa-solid fa-chart-line text-blue-500"></i> MIS Reports</h2>
      <p id="mis-saved-note" class="text-xs text-slate-400 mt-1"></p></div>
    <div class="flex flex-wrap items-end gap-2 no-print">
      <div><label for="mis-saved" class="block text-xs font-medium text-slate-300 mb-1">My reports</label><select id="mis-saved" class="bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm max-w-[14rem]"></select></div>
      <div><label for="mis-type" class="block text-xs font-medium text-slate-300 mb-1">Report</label><select id="mis-type" class="bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm"></select></div>
      <div><label for="mis-company" class="block text-xs font-medium text-slate-300 mb-1">Company</label><select id="mis-company" class="bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm"></select></div>
      <div><label for="mis-month" class="block text-xs font-medium text-slate-300 mb-1">Month</label><input id="mis-month" type="month" class="bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm"></div>
      <div><label for="mis-mode" class="block text-xs font-medium text-slate-300 mb-1">Compare</label><select id="mis-mode" class="bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm"></select></div>
      <button id="mis-run" class="bg-blue-600 hover:bg-blue-500 text-white text-sm px-4 py-2 rounded-lg">Show</button>
    </div>
  </div>
  <div class="flex flex-wrap items-center gap-2 no-print">
    <label for="mis-chart" class="text-xs text-slate-300">Chart</label>
    <select id="mis-chart" class="bg-slate-900 border border-slate-700 rounded-lg py-1.5 px-2 text-sm"><option value="bar">Bars</option><option value="line">Line</option><option value="none">No chart</option></select>
    <button id="mis-copy" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-1.5 rounded"><i class="fa-solid fa-copy"></i> Copy</button>
    <button id="mis-print" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-1.5 rounded"><i class="fa-solid fa-print"></i> Print</button>
    <span class="flex-1"></span>
    <button id="mis-save-as" class="hidden bg-slate-700 hover:bg-slate-600 text-xs px-3 py-1.5 rounded"><i class="fa-solid fa-floppy-disk"></i> Save as…</button>
    <button id="mis-save" class="hidden bg-slate-700 hover:bg-slate-600 text-xs px-3 py-1.5 rounded">Save changes</button>
    <button id="mis-share" class="hidden bg-slate-700 hover:bg-slate-600 text-xs px-3 py-1.5 rounded"><i class="fa-solid fa-share-nodes"></i> Share</button>
    <button id="mis-delete" class="hidden bg-red-600/20 hover:bg-red-600/30 text-red-400 border border-red-500/30 text-xs px-3 py-1.5 rounded">Delete</button>
  </div>
  <!-- The report builder (phase 4, Q446-Q449): a data set's lines, filtered, grouped (one or two fields) with totals, pivoted, or listed. -->
  <div id="mis-builder" class="hidden no-print bg-slate-800/40 border border-slate-700 rounded-xl p-3 space-y-3">
    <div class="flex flex-wrap items-end gap-2">
      <div><label for="mb-dataset" class="block text-xs font-medium text-slate-300 mb-1">Data set</label><select id="mb-dataset" class="bg-slate-900 border border-slate-700 rounded-lg py-1.5 px-2 text-sm"></select></div>
      <div><label for="mb-months" class="block text-xs font-medium text-slate-300 mb-1">Months, ending the month</label><input id="mb-months" type="number" min="1" max="24" value="1" class="w-20 bg-slate-900 border border-slate-700 rounded-lg py-1.5 px-2 text-sm"></div>
      <div><label for="mb-view" class="block text-xs font-medium text-slate-300 mb-1">Show</label><select id="mb-view" class="bg-slate-900 border border-slate-700 rounded-lg py-1.5 px-2 text-sm"><option value="group">Grouped with totals</option><option value="pivot">Pivot (rows × columns)</option><option value="list">A list of lines</option></select></div>
    </div>
    <div id="mb-group" class="flex flex-wrap items-end gap-2">
      <div><label for="mb-by1" class="block text-xs font-medium text-slate-300 mb-1">Group by</label><select id="mb-by1" class="mb-field bg-slate-900 border border-slate-700 rounded-lg py-1.5 px-2 text-sm"></select></div>
      <div><label for="mb-by2" class="block text-xs font-medium text-slate-300 mb-1">then by</label><select id="mb-by2" class="mb-field mb-optional bg-slate-900 border border-slate-700 rounded-lg py-1.5 px-2 text-sm"></select></div>
      <div><label for="mb-m1" class="block text-xs font-medium text-slate-300 mb-1">Total</label><span class="flex gap-1"><select id="mb-a1" class="mb-agg bg-slate-900 border border-slate-700 rounded-lg py-1.5 px-2 text-sm"></select><select id="mb-m1" class="mb-num bg-slate-900 border border-slate-700 rounded-lg py-1.5 px-2 text-sm"></select></span></div>
      <div><label for="mb-m2" class="block text-xs font-medium text-slate-300 mb-1">and</label><span class="flex gap-1"><select id="mb-a2" class="mb-agg mb-optional-agg bg-slate-900 border border-slate-700 rounded-lg py-1.5 px-2 text-sm"></select><select id="mb-m2" class="mb-num mb-optional bg-slate-900 border border-slate-700 rounded-lg py-1.5 px-2 text-sm"></select></span></div>
    </div>
    <div id="mb-pivot" class="hidden flex flex-wrap items-end gap-2">
      <div><label for="mb-prows" class="block text-xs font-medium text-slate-300 mb-1">Rows</label><select id="mb-prows" class="mb-field bg-slate-900 border border-slate-700 rounded-lg py-1.5 px-2 text-sm"></select></div>
      <div><label for="mb-pcols" class="block text-xs font-medium text-slate-300 mb-1">Columns</label><select id="mb-pcols" class="mb-field bg-slate-900 border border-slate-700 rounded-lg py-1.5 px-2 text-sm"></select></div>
      <div><label for="mb-pm" class="block text-xs font-medium text-slate-300 mb-1">Figure</label><span class="flex gap-1"><select id="mb-pa" class="mb-agg bg-slate-900 border border-slate-700 rounded-lg py-1.5 px-2 text-sm"></select><select id="mb-pm" class="mb-num bg-slate-900 border border-slate-700 rounded-lg py-1.5 px-2 text-sm"></select></span></div>
    </div>
    <div id="mb-list" class="hidden"><div class="block text-xs font-medium text-slate-300 mb-1">Columns</div><div id="mb-cols" class="flex flex-wrap gap-3 text-sm"></div></div>
    <div><div class="block text-xs font-medium text-slate-300 mb-1">Filters</div><div id="mb-filters" class="space-y-1"></div>
      <button id="mb-add-filter" class="mt-1 text-xs text-blue-400 hover:text-blue-300"><i class="fa-solid fa-plus"></i> Add a filter</button></div>
  </div>
  <div id="mis-save-panel" class="hidden no-print bg-slate-800/40 border border-slate-700 rounded-xl p-3 flex flex-wrap items-end gap-2">
    <div><label for="mis-save-name" class="block text-xs font-medium text-slate-300 mb-1">Name</label><input id="mis-save-name" maxlength="60" class="w-56 bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm"></div>
    <div><label for="mis-save-period" class="block text-xs font-medium text-slate-300 mb-1">Opens on</label><select id="mis-save-period" class="bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm"><option value="latest">The latest month</option><option value="fixed">This month, kept</option></select></div>
    <button id="mis-save-ok" class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm px-4 py-2 rounded-lg">Save</button>
    <button id="mis-save-cancel" class="bg-slate-700 hover:bg-slate-600 text-sm px-3 py-2 rounded-lg">Cancel</button>
  </div>
  <div id="mis-share-panel" class="hidden no-print bg-slate-800/40 border border-slate-700 rounded-xl p-3 space-y-2">
    <p class="text-xs text-slate-400">Share this report with the roles ticked; their users see it under "Shared with me", and cannot change it.</p>
    <div id="mis-share-roles" class="flex flex-wrap gap-3 text-sm"></div>
    <div class="flex gap-2"><button id="mis-share-ok" class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm px-4 py-2 rounded-lg">Save sharing</button><button id="mis-share-cancel" class="bg-slate-700 hover:bg-slate-600 text-sm px-3 py-2 rounded-lg">Cancel</button></div>
  </div>
  <p id="mis-period" class="text-xs text-slate-400"></p>
  <div id="mis-extra"></div>
  <div id="mis-chart-box" class="hidden bg-slate-800/40 border border-slate-700 rounded-xl p-3"><div class="relative h-64"><canvas id="mis-canvas"></canvas></div><p id="mis-chart-note" class="hidden text-xs text-slate-500"></p></div>
  <div class="bg-slate-800/40 border border-slate-700 rounded-xl overflow-x-auto">
    <table id="mis-table" class="w-full text-left text-sm"><thead id="mis-head"></thead><tbody id="mis-body" class="divide-y divide-slate-800"></tbody></table>
  </div>
  <p id="mis-notes" class="text-xs text-slate-500"></p>
</div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const call = (name, data) => new Promise((ok, fail) => rpc.withSuccessHandler(ok).withFailureHandler(fail)[name](data));
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = n => (n == null ? '—' : (Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
  const pct = n => (n == null ? '—' : (n > 0 ? '+' : '') + n.toFixed(1) + '%');
  const tone = good => (good === true ? 'text-emerald-400' : good === false ? 'text-red-400' : 'text-slate-300');
  const shown = t => (window.formatDatesInText ? window.formatDatesInText(String(t)) : String(t));
  const thisMonth = () => (window.isoLocalDateTime ? window.isoLocalDateTime(new Date()) : new Date().toISOString()).slice(0, 7);
  const CLASS = { fast: 'Fast', normal: 'Normal', slow: 'Slow', nonMoving: 'Non-moving' };
  let C = null, S = { mine: [], shared: [], rights: {} }, last = null, cols = [], open = null;

  function head(c) { cols = c; $('mis-head').innerHTML = '<tr class="text-xs text-slate-400 uppercase border-b border-slate-700">' + c.map((x, i) => '<th class="py-2 px-3' + (i ? ' text-right' : '') + '">' + esc(x) + '</th>').join('') + '</tr>'; }
  const td = (i, html, cls) => '<td data-label="' + esc(cols[i] || '') + '" class="py-2 px-3' + (i ? ' text-right' : '') + (cls ? ' ' + cls : '') + '">' + html + '</td>';
  // The table as text for Excel: the same lines and columns, dates as shown.
  let copyRows = [];
  async function drawChart(r) {
    const style = $('mis-chart').value;
    const box = $('mis-chart-box');
    if (style === 'none' || (r.type !== 'trend' && r.type !== 'stockCover' && !(r.rows || []).some(x => x.key !== 'total' && x.current != null))) { box.classList.add('hidden'); return; }
    box.classList.remove('hidden'); $('mis-chart-note').classList.add('hidden');
    try { await misTiles.chart($('mis-canvas'), r, style); }
    catch (e) { $('mis-chart-note').textContent = e.message; $('mis-chart-note').classList.remove('hidden'); }
  }
  function draw(r) {
    last = r;
    $('mis-period').textContent = r.title + ': ' + r.period.current + (r.period.compare ? ' ' + r.modeLabel + ' (' + r.period.compare + ')' : '');
    $('mis-notes').textContent = (r.notes || []).join(' ');
    $('mis-extra').innerHTML = '';
    drawChart(r);
    if (r.type === 'trend') {
      head(['Month', 'Revenue', 'Expenses', 'Net profit']);
      copyRows = r.rows.map(x => [shown(x.label), x.revenue, x.expenses, x.netProfit]);
      $('mis-body').innerHTML = r.rows.map(x => '<tr>' + td(0, esc(x.label)) + td(1, fmt(x.revenue)) + td(2, fmt(x.expenses)) + td(3, fmt(x.netProfit)) + '</tr>').join('');
      return;
    }
    if (r.type === 'stockCover') {
      $('mis-extra').innerHTML = '<div class="flex flex-wrap gap-2">' + r.classes.map(c => '<span class="text-xs px-2 py-1 rounded-full border border-slate-700">' + esc(CLASS[c.key]) + ': ' + c.count + ' items · ' + fmt(c.value) + '</span>').join('') + '</div>';
      head(['Item', 'On hand', 'Moved', 'Days of cover', 'Class']);
      copyRows = r.rows.map(x => [x.label, x.onHand, x.moved, x.cover == null ? '' : Math.round(x.cover), CLASS[x.class] || x.class]);
      $('mis-body').innerHTML = r.rows.map(x => '<tr data-key="' + esc(x.key) + '">' + td(0, esc(x.label)) + td(1, fmt(x.onHand)) + td(2, fmt(x.moved)) +
        td(3, x.cover == null ? '—' : x.cover.toFixed(0)) + td(4, esc(CLASS[x.class] || x.class)) + '</tr>').join('');
      return;
    }
    if (r.buckets) $('mis-extra').innerHTML = '<div class="flex flex-wrap gap-2">' + r.buckets.map(b => '<span class="text-xs px-2 py-1 rounded-full border border-slate-700">' + esc(b.label) + ': ' + fmt(b.amount) + '</span>').join('') + '</div>';
    head(['', 'This period', 'Compared with', 'Change', '%']);
    const val = (x, v) => (x.unit === '%' && v != null ? v.toFixed(1) + '%' : x.unit === 'x' && v != null ? v.toFixed(2) : x.unit === 'days' && v != null ? v.toFixed(0) + ' days' : fmt(v));
    copyRows = r.rows.map(x => [x.label, x.current, x.compare, x.abs, x.pct == null ? '' : x.pct / 100]);
    $('mis-body').innerHTML = r.rows.map(x => '<tr data-key="' + esc(x.key) + '" class="' + (x.level ? 'font-semibold' : '') + '">' + td(0, esc(x.label)) + td(1, val(x, x.current)) +
      td(2, val(x, x.compare), 'text-slate-400') + td(3, x.abs == null ? '—' : (x.unit ? val(x, x.abs) : fmt(x.abs)), tone(x.good)) + td(4, pct(x.pct), tone(x.good)) + '</tr>').join('') ||
      '<tr><td colspan="5" class="py-6 text-center text-slate-500">Nothing for this period.</td></tr>';
  }
  async function run() {
    $('mis-body').innerHTML = '<tr><td class="py-6 px-3 text-slate-500">Working…</td></tr>';
    if (building()) {
      try { await loadBuilder(); drawBuilt(await call('runMisBuilder', Object.assign(builderSpec(), { companyId: $('mis-company').value, month: $('mis-month').value }))); }
      catch (e) { $('mis-body').innerHTML = ''; $('mis-chart-box').classList.add('hidden'); appAlert(e.message); }
      return;
    }
    try { draw(await call('runMisReport', { type: $('mis-type').value, companyId: $('mis-company').value, month: $('mis-month').value, mode: $('mis-mode').value })); }
    catch (e) { $('mis-body').innerHTML = ''; $('mis-chart-box').classList.add('hidden'); appAlert(e.message); }
  }
  async function copy() {
    if (!last) return;
    const cell = v => (v == null ? '' : String(v).replace(/[\t\n]/g, ' '));
    const text = [cols.map(cell).join('\t')].concat(copyRows.map(r => r.map(cell).join('\t'))).join('\n');
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => appAlert('Copied: paste it into Excel.'), async () => (await appPrompt('Copy this text:', text)));
    else await appPrompt('Copy this text:', text);
  }

  // ---------- My reports (Q443-Q445) ----------
  function fillSaved(selectId) {
    const opt = r => '<option value="' + esc(r.id) + '">' + esc(r.name) + '</option>';
    $('mis-saved').innerHTML = '<option value="">— Choose a saved report —</option>' +
      (S.mine.length ? '<optgroup label="Mine">' + S.mine.map(opt).join('') + '</optgroup>' : '') +
      (S.shared.length ? '<optgroup label="Shared with me">' + S.shared.map(opt).join('') + '</optgroup>' : '');
    $('mis-saved').value = selectId || '';
  }
  function buttons() {
    const mine = open && S.mine.some(r => r.id === open.id);
    $('mis-save-as').classList.toggle('hidden', !S.rights.design);
    $('mis-save').classList.toggle('hidden', !(mine && S.rights.design));
    $('mis-delete').classList.toggle('hidden', !mine);
    $('mis-share').classList.toggle('hidden', !(mine && S.rights.publish));
    $('mis-saved-note').textContent = !open ? '' : mine ? 'Saved report: ' + open.name + (open.sharedRoles.length ? ' · shared with ' + open.sharedRoles.length + ' role(s)' : ' · private') + (open.period.kind === 'fixed' ? ' · keeps ' + shown(open.period.month) : ' · the latest month')
      : 'Shared with you by ' + open.owner + ': ' + open.name + ' (read-only; Save as… to keep your own copy)';
  }
  async function loadSaved(selectId) {
    S = await call('getMyMisReports', {});
    fillSaved(selectId);
    open = selectId ? S.mine.concat(S.shared).find(r => r.id === selectId) || null : null;
    buttons();
  }
  function openSaved() {
    const id = $('mis-saved').value;
    open = S.mine.concat(S.shared).find(r => r.id === id) || null;
    buttons();
    if (!open) return;
    $('mis-type').value = open.type === 'builder' ? '__builder' : open.type;
    typeChanged();
    if (open.type === 'builder' && open.builder) { loadBuilder().then(() => { setSpec(open.builder); run(); }); }
    if ([...$('mis-company').options].some(o => o.value === open.companyId)) $('mis-company').value = open.companyId;
    $('mis-mode').value = open.mode;
    $('mis-chart').value = open.chart;
    $('mis-month').value = open.period.kind === 'fixed' ? open.period.month : thisMonth();
    if (open.type !== 'builder') run();
  }
  // The builder's panel and the comparison (a catalogue report's) follow the choice.
  function typeChanged() {
    $('mis-builder').classList.toggle('hidden', !building());
    $('mis-mode').disabled = building();
    if (building()) loadBuilder().catch(e => appAlert(e.message));
  }
  const current = () => Object.assign({ type: building() ? 'builder' : $('mis-type').value, companyId: $('mis-company').value, mode: $('mis-mode').value, chart: $('mis-chart').value },
    building() ? { builder: builderSpec() } : {});
  async function saveChanges() {
    if (!open) return;
    try { await call('saveMisReport', Object.assign({ id: open.id, name: open.name, period: open.period.kind === 'fixed' ? { kind: 'fixed', month: $('mis-month').value } : { kind: 'latest' } }, current())); appAlert('Saved.'); await loadSaved(open.id); }
    catch (e) { appAlert(e.message); }
  }
  async function saveAs() {
    const name = $('mis-save-name').value.trim();
    if (!name) { appAlert('Give the report a name.'); return; }
    const period = $('mis-save-period').value === 'fixed' ? { kind: 'fixed', month: $('mis-month').value } : { kind: 'latest' };
    try { const r = await call('saveMisReport', Object.assign({ name, period }, current())); $('mis-save-panel').classList.add('hidden'); appAlert('Saved as "' + name + '".'); await loadSaved(r.id); }
    catch (e) { appAlert(e.message); }
  }
  function shareOpen() {
    $('mis-share-roles').innerHTML = (S.roles || []).map(r => '<label class="flex items-center gap-1"><input type="checkbox" class="mis-share-role" value="' + esc(r.id) + '"' + (open.sharedRoles.includes(r.id) ? ' checked' : '') + '> ' + esc(r.name) + '</label>').join('');
    $('mis-share-panel').classList.remove('hidden');
  }
  async function shareSave() {
    const roles = [...document.querySelectorAll('.mis-share-role')].filter(x => x.checked).map(x => x.value);
    try { await call('shareMisReport', { id: open.id, roles }); $('mis-share-panel').classList.add('hidden'); appAlert(roles.length ? 'Shared with ' + roles.length + ' role(s).' : 'The report is private again.'); await loadSaved(open.id); }
    catch (e) { appAlert(e.message); }
  }
  async function remove() {
    if (!(await appConfirm('Delete the saved report "' + open.name + '"? The roles it is shared with lose it too.'))) return;
    try { await call('deleteMisReport', { id: open.id }); open = null; await loadSaved(''); }
    catch (e) { appAlert(e.message); }
  }

  // ---------- the report builder (phase 4, Q446-Q449) ----------
  let B = null, bsort = null;
  const building = () => $('mis-type').value === '__builder';
  const AGG = { sum: 'Total of', count: 'Count of lines', avg: 'Average', min: 'Lowest', max: 'Highest' };
  const OP = { eq: 'is', ne: 'is not', contains: 'contains', gt: 'after / over', lt: 'before / under', between: 'between' };
  const dsNow = () => (B && B.datasets.find(d => d.id === $('mb-dataset').value)) || null;
  const opts = (fs, optional) => (optional ? '<option value="">—</option>' : '') + fs.map(f => '<option value="' + esc(f.key) + '">' + esc(f.label) + '</option>').join('');
  function fields() {
    const ds = dsNow(); if (!ds) return;
    const all = ds.fields, nums = all.filter(f => f.type === 'number');
    document.querySelectorAll('#mis-builder .mb-field').forEach(el => { const was = el.value; el.innerHTML = opts(all, el.classList.contains('mb-optional')); if ([...el.options].some(o => o.value === was)) el.value = was; });
    document.querySelectorAll('#mis-builder .mb-num').forEach(el => { const was = el.value; el.innerHTML = opts(nums, el.classList.contains('mb-optional')); if ([...el.options].some(o => o.value === was)) el.value = was; });
    document.querySelectorAll('#mis-builder .mb-agg').forEach(el => { const was = el.value; el.innerHTML = B.aggs.map(a => '<option value="' + a + '">' + esc(AGG[a]) + '</option>').join(''); el.value = was || 'sum'; });
    $('mb-cols').innerHTML = all.map(f => '<label class="flex items-center gap-1"><input type="checkbox" class="mb-col" value="' + esc(f.key) + '"> ' + esc(f.label) + '</label>').join('');
    document.querySelectorAll('.mb-filter-field').forEach(el => { const was = el.value; el.innerHTML = opts(all); if ([...el.options].some(o => o.value === was)) el.value = was; });
  }
  function view() { const v = $('mb-view').value; $('mb-group').classList.toggle('hidden', v !== 'group'); $('mb-pivot').classList.toggle('hidden', v !== 'pivot'); $('mb-list').classList.toggle('hidden', v !== 'list'); }
  function addFilter(f) {
    const ds = dsNow(); if (!ds) return;
    const row = document.createElement('div');
    row.className = 'mb-filter flex flex-wrap items-center gap-1';
    row.innerHTML = '<select class="mb-filter-field bg-slate-900 border border-slate-700 rounded-lg py-1.5 px-2 text-sm">' + opts(ds.fields) + '</select><select class="mb-filter-op bg-slate-900 border border-slate-700 rounded-lg py-1.5 px-2 text-sm">' + B.ops.map(o => '<option value="' + o + '">' + esc(OP[o]) + '</option>').join('') +
      '</select><input class="mb-filter-value w-36 bg-slate-900 border border-slate-700 rounded-lg py-1.5 px-2 text-sm"><input class="mb-filter-to hidden w-36 bg-slate-900 border border-slate-700 rounded-lg py-1.5 px-2 text-sm" placeholder="to"><button class="mb-filter-remove text-slate-500 hover:text-red-400" title="Remove the filter"><i class="fa-solid fa-xmark"></i></button>';
    const op = row.querySelector('.mb-filter-op');
    op.addEventListener('change', () => row.querySelector('.mb-filter-to').classList.toggle('hidden', op.value !== 'between'));
    row.querySelector('.mb-filter-remove').addEventListener('click', () => row.remove());
    $('mb-filters').appendChild(row);
    if (f) { row.querySelector('.mb-filter-field').value = f.field; op.value = f.op; row.querySelector('.mb-filter-value').value = f.value || ''; row.querySelector('.mb-filter-to').value = f.to || ''; op.dispatchEvent(new Event('change')); }
  }
  function spec() {
    const v = $('mb-view').value;
    const filters = [...document.querySelectorAll('.mb-filter')].map(r => ({ field: r.querySelector('.mb-filter-field').value, op: r.querySelector('.mb-filter-op').value, value: r.querySelector('.mb-filter-value').value, to: r.querySelector('.mb-filter-to').value }))
      .filter(f => f.value !== '' || f.to !== '');
    const m = (a, f) => ($(a).value === 'count' ? { agg: 'count' } : { agg: $(a).value, field: $(f).value });
    const out = { view: v, filters, limit: 500 };
    if (v === 'group') { out.groupBy = [$('mb-by1').value, $('mb-by2').value].filter(Boolean); out.measures = [m('mb-a1', 'mb-m1')].concat($('mb-m2').value ? [m('mb-a2', 'mb-m2')] : []); }
    if (v === 'pivot') out.pivot = { rows: $('mb-prows').value, cols: $('mb-pcols').value, measure: m('mb-pa', 'mb-pm') };
    if (v === 'list') out.columns = [...document.querySelectorAll('.mb-col')].filter(x => x.checked).map(x => x.value);
    if (bsort) out.sort = bsort;
    return out;
  }
  function setSpec(b) {
    $('mb-dataset').value = b.dataset; $('mb-months').value = b.months; fields();
    const s = b.spec; $('mb-view').value = s.view; view();
    if (s.view === 'group') { $('mb-by1').value = s.groupBy[0]; $('mb-by2').value = s.groupBy[1] || ''; [['mb-a1', 'mb-m1'], ['mb-a2', 'mb-m2']].forEach(([a, f], i) => { const x = s.measures[i]; $(a).value = x ? x.agg : 'sum'; $(f).value = x && x.field ? x.field : ''; }); }
    if (s.view === 'pivot') { $('mb-prows').value = s.pivot.rows; $('mb-pcols').value = s.pivot.cols; $('mb-pa').value = s.pivot.measure.agg; $('mb-pm').value = s.pivot.measure.field || ''; }
    if (s.view === 'list') document.querySelectorAll('.mb-col').forEach(x => { x.checked = s.columns.includes(x.value); });
    $('mb-filters').innerHTML = ''; (s.filters || []).forEach(addFilter);
    bsort = s.sort || null;
  }
  const builderSpec = () => ({ dataset: $('mb-dataset').value, months: Number($('mb-months').value) || 1, spec: spec() });
  function drawBuilt(r) {
    last = r;
    $('mis-period').textContent = r.title + ': ' + r.period + ' · ' + r.lines + ' lines' + (r.truncated ? ' · showing the first ' + r.rows.length : '') + (r.colsTruncated ? ' · the 24 busiest columns' : '');
    $('mis-notes').textContent = 'Amounts in the base currency, before tax, after each document\'s discount.' + (r.linesTruncated ? ' Too many lines: shorten the months or add a filter.' : '');
    $('mis-extra').innerHTML = '';
    cols = r.columns.map(c => c.label);
    const isNum = i => r.columns[i].type === 'number';
    const cell = (v, i) => (isNum(i) ? (v == null ? '—' : fmt(v)) : esc(v));
    $('mis-head').innerHTML = '<tr class="text-xs text-slate-400 uppercase border-b border-slate-700">' + r.columns.map((c, i) => '<th class="py-2 px-3 cursor-pointer mb-sort' + (isNum(i) ? ' text-right' : '') + '" data-i="' + i + '" title="Sort">' + esc(c.label) +
      (bsort && bsort.by === i ? (bsort.dir === 'asc' ? ' ▲' : ' ▼') : '') + '</th>').join('') + '</tr>';
    document.querySelectorAll('.mb-sort').forEach(th => th.addEventListener('click', () => { const i = Number(th.dataset.i); bsort = { by: i, dir: bsort && bsort.by === i && bsort.dir === 'desc' ? 'asc' : 'desc' }; run(); }));
    $('mis-body').innerHTML = r.rows.map(row => '<tr>' + row.map((v, i) => td(i, cell(v, i))).join('') + '</tr>').join('') +
      (r.totals ? '<tr class="font-semibold border-t border-slate-600">' + r.totals.map((v, i) => td(i, cell(v, i))).join('') + '</tr>' : '') ||
      '<tr><td class="py-6 text-center text-slate-500">Nothing matches.</td></tr>';
    copyRows = r.rows.concat(r.totals ? [r.totals] : []);
    // The chart: the first grouping by its first total (a pivot: its rows by their totals).
    const rows = r.view === 'list' ? [] : r.rows.map(x => ({ key: String(x[0]), label: r.view === 'group' && r.columns[1].type !== 'number' ? x[0] + ' · ' + x[1] : String(x[0]),
      current: x[r.view === 'group' ? r.columns.findIndex(c => c.type === 'number') : x.length - 1] }));
    drawChart({ type: 'builder', rows });
  }
  async function loadBuilder() {
    if (B) return;
    B = await call('getMisDatasets', {});
    // Built modules' data sets (Module Builder, phase 5) under their own heading.
    const opt = d => '<option value="' + esc(d.id) + '">' + esc(d.title) + '</option>';
    const built = B.datasets.filter(d => d.built);
    $('mb-dataset').innerHTML = B.datasets.filter(d => !d.built).map(opt).join('') + (built.length ? '<optgroup label="Built modules">' + built.map(opt).join('') + '</optgroup>' : '');
    fields(); view();
  }

  window.initModule = function () {
    $('app-title').innerHTML = '<i class="fa-solid fa-chart-line"></i> MIS Reports';
    $('mis-month').value = thisMonth();
    $('mis-run').addEventListener('click', run);
    $('mis-chart').addEventListener('change', () => last && drawChart(last));
    $('mis-copy').addEventListener('click', copy);
    $('mis-print').addEventListener('click', () => window.print());
    $('mis-saved').addEventListener('change', openSaved);
    $('mis-save').addEventListener('click', saveChanges);
    $('mis-save-as').addEventListener('click', () => { $('mis-save-name').value = open ? open.name + ' (copy)' : ''; $('mis-save-panel').classList.remove('hidden'); $('mis-save-name').focus(); });
    $('mis-save-ok').addEventListener('click', saveAs);
    $('mis-save-cancel').addEventListener('click', () => $('mis-save-panel').classList.add('hidden'));
    $('mis-share').addEventListener('click', shareOpen);
    $('mis-share-ok').addEventListener('click', shareSave);
    $('mis-share-cancel').addEventListener('click', () => $('mis-share-panel').classList.add('hidden'));
    $('mis-delete').addEventListener('click', remove);
    $('mis-type').addEventListener('change', typeChanged);
    $('mb-dataset').addEventListener('change', () => { fields(); $('mb-filters').innerHTML = ''; bsort = null; });
    $('mb-view').addEventListener('change', () => { view(); bsort = null; });
    $('mb-add-filter').addEventListener('click', () => addFilter());
    Promise.all([call('getMisCatalogue', {}), call('getActiveCompanies', {}).catch(() => []), call('getMyMisReports', {}).catch(() => S)]).then(([cat, cos, saved]) => {
      C = cat; S = saved;
      $('mis-type').innerHTML = cat.catalogue.map(c => '<option value="' + esc(c.type) + '">' + esc(c.group + ' · ' + c.title) + '</option>').join('') +
        '<option value="__builder">Build a report…</option>';
      $('mis-mode').innerHTML = cat.modes.map(m => '<option value="' + esc(m.mode) + '">' + esc(m.label) + '</option>').join('');
      $('mis-company').innerHTML = (cos || []).map(c => '<option value="' + esc(c.CompanyID) + '">' + esc(c.LegalName || c.CompanyID) + '</option>').join('');
      fillSaved(''); buttons();
      return run();
    }, e => appAlert(e.message));
  };
})();
</script>
