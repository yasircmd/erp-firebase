<style>
  @media print {
    #back-to-tree-btn, #tree-controls, #user-menu, .no-print { display: none !important; }
    body, #app-container { background: white !important; color: black !important; }
  }
</style>

<div class="space-y-6">
  <div class="flex items-center justify-between border-b border-slate-800 pb-4 no-print">
    <div class="flex items-center gap-3">
      <button id="bs-back-btn" class="hidden bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded border border-slate-700"><i class="fa-solid fa-arrow-left"></i> <span id="bs-back-label">Back</span></button>
      <div><div class="text-xs font-semibold text-blue-400 uppercase mb-1">Financial Reports</div><h2 class="text-2xl font-bold"><i class="fa-solid fa-building-columns text-blue-500"></i> Balance Sheet (BS)</h2></div>
    </div>
    <button id="bs-print-btn" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded border border-slate-700"><i class="fa-solid fa-print"></i> Print</button>
  </div>

  <div class="bg-slate-800/60 border border-slate-700 rounded-xl p-4 space-y-3 no-print">
    <div class="grid grid-cols-2 md:grid-cols-6 gap-3">
      <div><label class="block text-xs font-medium text-slate-300 mb-1">As Of</label><input type="date" id="bs-asof-date" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm"></div>
      <div><label class="block text-xs font-medium text-slate-300 mb-1">Company</label><select id="bs-company" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm"><option value="">All</option></select></div>
      <div><label class="block text-xs font-medium text-slate-300 mb-1">Division</label><select id="bs-division" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm"><option value="">All</option></select></div>
      <div><label class="block text-xs font-medium text-slate-300 mb-1">Branch</label><select id="bs-branch" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm"><option value="">All</option></select></div>
      <div><label class="block text-xs font-medium text-slate-300 mb-1">Cost Center</label><select id="bs-costcenter" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm"><option value="">All</option></select></div>
      <div><label class="block text-xs font-medium text-slate-300 mb-1">Profit Center</label><select id="bs-profitcenter" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm"><option value="">All</option></select></div>
    </div>
    <div class="flex justify-end gap-2">
      <button id="bs-copy-btn" class="bg-slate-700 hover:bg-slate-600 text-xs px-4 py-2 rounded-lg"><i class="fa-solid fa-copy"></i> Copy Table</button>
      <button id="bs-run-btn" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-4 py-2 rounded-lg font-medium">Run Report</button>
    </div>
  </div>

  <div id="bs-error" class="hidden text-xs text-red-400 bg-red-500/10 border border-red-500/20 p-2.5 rounded-lg"></div>

  <div id="bs-results" class="hidden space-y-4">
    <h3 class="text-sm text-slate-400">As of <span id="bs-asof-label" class="text-slate-200 font-medium"></span></h3>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden">
        <div class="bg-slate-900 border-b border-slate-700 px-4 py-2 text-xs font-semibold text-slate-400 uppercase">Assets</div>
        <table class="w-full text-left"><tbody id="bs-assets-body" class="divide-y divide-slate-700 text-sm"></tbody></table>
      </div>
      <div class="space-y-4">
        <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden">
          <div class="bg-slate-900 border-b border-slate-700 px-4 py-2 text-xs font-semibold text-slate-400 uppercase">Liabilities</div>
          <table class="w-full text-left"><tbody id="bs-liabilities-body" class="divide-y divide-slate-700 text-sm"></tbody></table>
        </div>
        <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden">
          <div class="bg-slate-900 border-b border-slate-700 px-4 py-2 text-xs font-semibold text-slate-400 uppercase">Equity</div>
          <table class="w-full text-left"><tbody id="bs-equity-body" class="divide-y divide-slate-700 text-sm"></tbody></table>
        </div>
      </div>
    </div>

    <div id="bs-balance-note" class="hidden text-sm px-4 py-2.5 rounded-lg border"></div>
  </div>
</div>

<script>
(function () {
  let token = '';
  let orgUnits = [];
  let lastReport = null;
  let lastParams = null;
  let myReturnChain = [];
  let companiesReady = false, orgUnitsReady = false;

  function escapeHtml(value) {
    const div = document.createElement('div');
    div.textContent = value == null ? '' : String(value);
    return div.innerHTML;
  }
  function formatMoney(n) {
    const num = Number(n) || 0;
    return num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function fmt(n) { return (Number(n) || 0).toFixed(2); }
  function today() { return new Date().toISOString().substring(0, 10); }

  function populateOrgUnitSelect(selectId, type) {
    const select = document.getElementById(selectId);
    select.innerHTML = '<option value="">All</option>';
    orgUnits.filter(u => u.Type === type)
      .sort((a, b) => String(a.Code).localeCompare(String(b.Code), undefined, { numeric: true }))
      .forEach(u => {
        const opt = document.createElement('option');
        opt.value = u.UnitID; opt.textContent = u.Code + ' — ' + u.Name;
        select.appendChild(opt);
      });
  }

  function checkReadyAndApplyPending() {
    if (!companiesReady || !orgUnitsReady) return;
    const p = window.__pendingModuleParams;
    if (!p) return;
    window.__pendingModuleParams = null;

    document.getElementById('bs-asof-date').value = p.AsOfDate || today();
    document.getElementById('bs-company').value = p.CompanyID || '';
    document.getElementById('bs-division').value = p.DivisionID || '';
    document.getElementById('bs-branch').value = p.BranchID || '';
    document.getElementById('bs-costcenter').value = p.CostCenterID || '';
    document.getElementById('bs-profitcenter').value = p.ProfitCenterID || '';

    runReport();
  }

  function loadReferenceData() {
    rpc
      .withSuccessHandler(result => {
        const select = document.getElementById('bs-company');
        select.innerHTML = '<option value="">All</option>';
        (result || []).sort((a, b) => a.LegalName.localeCompare(b.LegalName)).forEach(c => {
          const opt = document.createElement('option'); opt.value = c.CompanyID; opt.textContent = c.LegalName;
          select.appendChild(opt);
        });
        companiesReady = true;
        checkReadyAndApplyPending();
      })
      .withFailureHandler(err => console.error(err))
      .getActiveCompanies();

    rpc
      .withSuccessHandler(result => {
        orgUnits = result || [];
        populateOrgUnitSelect('bs-division', 'Division');
        populateOrgUnitSelect('bs-branch', 'Branch');
        populateOrgUnitSelect('bs-costcenter', 'CostCenter');
        populateOrgUnitSelect('bs-profitcenter', 'ProfitCenter');
        orgUnitsReady = true;
        checkReadyAndApplyPending();
      })
      .withFailureHandler(err => console.error(err))
      .getActiveOrgUnits();
  }

  function runReport() {
    const error = document.getElementById('bs-error');
    error.classList.add('hidden');
    document.getElementById('bs-results').classList.add('hidden');

    const params = {
      AsOfDate: document.getElementById('bs-asof-date').value,
      CompanyID: document.getElementById('bs-company').value,
      DivisionID: document.getElementById('bs-division').value,
      BranchID: document.getElementById('bs-branch').value,
      CostCenterID: document.getElementById('bs-costcenter').value,
      ProfitCenterID: document.getElementById('bs-profitcenter').value
    };
    lastParams = params;

    const btn = document.getElementById('bs-run-btn');
    btn.disabled = true; const original = btn.textContent; btn.textContent = 'Running...';
    rpc
      .withSuccessHandler(result => {
        btn.disabled = false; btn.textContent = original;
        lastReport = result;
        renderReport(result);
      })
      .withFailureHandler(err => {
        btn.disabled = false; btn.textContent = original;
        error.textContent = err.message || 'Unable to run report.'; error.classList.remove('hidden');
      })
      .getBalanceSheet({ params: params });
  }

  // Drills into GL Report using lastParams — the EXACT As Of date and
  // filters that produced the currently-displayed balance — and hands
  // back a return-chain entry so GL Report's "Back" restores this exact
  // view. Never called for the synthetic "Retained Earnings" row, which
  // has no real AccountCode (guarded in renderSection below).
  function drillToGl(accountCode) {
    openModule('GLREPORT', {
      AccountCode: accountCode,
      FromDate: '',
      ToDate: lastParams.AsOfDate,
      CompanyID: lastParams.CompanyID,
      DivisionID: lastParams.DivisionID,
      BranchID: lastParams.BranchID,
      CostCenterID: lastParams.CostCenterID,
      ProfitCenterID: lastParams.ProfitCenterID
    }, [...myReturnChain, { moduleId: 'BALANCESHEET', label: 'Balance Sheet', params: lastParams }]);
  }

  function renderSection(bodyId, accounts, total, label) {
    const tbody = document.getElementById(bodyId);
    tbody.innerHTML = '';
    if (!accounts.length) {
      tbody.innerHTML = `<tr><td class="py-3 px-4 text-center text-slate-500 italic" colspan="2">No ${label.toLowerCase()}</td></tr>`;
    }
    accounts.forEach(a => {
      const tr = document.createElement('tr');
      const nameCell = a.AccountCode
        ? `<button class="bs-drill-link text-blue-400 hover:underline underline-offset-2">${escapeHtml(a.AccountCode)} — ${escapeHtml(a.AccountName)}</button>`
        : escapeHtml(a.AccountName);
      tr.innerHTML = `<td class="py-2 px-4 text-slate-300 text-sm">${nameCell}</td><td class="py-2 px-4 text-right text-sm">${formatMoney(a.Amount)}</td>`;
      if (a.AccountCode) tr.querySelector('.bs-drill-link').addEventListener('click', () => drillToGl(a.AccountCode));
      tbody.appendChild(tr);
    });
    const totalRow = document.createElement('tr');
    totalRow.className = 'border-t-2 border-slate-600 bg-slate-900/40 font-semibold';
    totalRow.innerHTML = `<td class="py-2 px-4">Total ${label}</td><td class="py-2 px-4 text-right">${formatMoney(total)}</td>`;
    tbody.appendChild(totalRow);
  }

  function renderReport(result) {
    document.getElementById('bs-results').classList.remove('hidden');
    document.getElementById('bs-asof-label').textContent = result.asOfDate;

    renderSection('bs-assets-body', result.assets, result.totalAssets, 'Assets');
    renderSection('bs-liabilities-body', result.liabilities, result.totalLiabilities, 'Liabilities');
    renderSection('bs-equity-body', result.equity, result.totalEquity, 'Equity');

    // Nothing to say when it balances; out of balance is shown in red (owner, 2026-09-29).
    const note = document.getElementById('bs-balance-note');
    note.className = 'text-sm px-4 py-2.5 rounded-lg border bg-red-500/10 border-red-500/20 text-red-400' + (result.balanced ? ' hidden' : '');
    note.textContent = result.balanced
      ? ''
      : `Out of balance — Total Assets (${formatMoney(result.totalAssets)}) does not equal Total Liabilities + Equity (${formatMoney(result.totalLiabilities + result.totalEquity)}). This indicates a data problem and should be investigated.`;
  }

  function copyTable() {
    if (!lastReport) { alert('Run the report first.'); return; }
    const rows = [];
    function section(title, accounts, total) {
      rows.push([title, ''].join('\t'));
      accounts.forEach(a => rows.push([(a.AccountCode ? a.AccountCode + ' - ' : '') + a.AccountName, fmt(a.Amount)].join('\t')));
      rows.push(['Total ' + title, fmt(total)].join('\t'));
    }
    section('Assets', lastReport.assets, lastReport.totalAssets);
    section('Liabilities', lastReport.liabilities, lastReport.totalLiabilities);
    section('Equity', lastReport.equity, lastReport.totalEquity);
    const text = rows.join('\n');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(() => window.prompt('Copy this text:', text));
    } else {
      window.prompt('Copy this text:', text);
    }
  }

  function goBackInChain() {
    const chain = myReturnChain.slice();
    const target = chain.pop();
    if (!target) return;
    openModule(target.moduleId, target.params, chain);
  }

  window.initModule = function (idToken) {
    token = idToken;
    document.getElementById('bs-asof-date').value = today();

    myReturnChain = window.__pendingReturnChain || [];
    window.__pendingReturnChain = [];
    if (myReturnChain.length) {
      const target = myReturnChain[myReturnChain.length - 1];
      document.getElementById('bs-back-label').textContent = 'Back to ' + (target.label || target.moduleId);
      document.getElementById('bs-back-btn').classList.remove('hidden');
      document.getElementById('bs-back-btn').addEventListener('click', goBackInChain);
    }

    loadReferenceData();

    document.getElementById('bs-run-btn').addEventListener('click', runReport);
    document.getElementById('bs-copy-btn').addEventListener('click', copyTable);
    document.getElementById('bs-print-btn').addEventListener('click', () => window.print());

    document.getElementById('app-title').innerHTML = '<i class="fa-solid fa-building-columns"></i> Balance Sheet (BS)';
  };
})();
</script>
