<style>
  @media print {
    #back-to-tree-btn, #tree-controls, #user-menu, .no-print { display: none !important; }
    body, #app-container { background: white !important; color: black !important; }
    #ia-report, #ia-report * { color: black !important; border-color: #999 !important; background: white !important; }
  }
  #ia-report table th, #ia-report table td { white-space: nowrap; }
</style>

<div class="space-y-5">
  <div class="flex items-center justify-between border-b border-slate-800 pb-4 no-print">
    <div><div class="text-xs font-semibold text-blue-400 uppercase mb-1">Stock Reports</div><h2 class="text-2xl font-bold"><i class="fa-solid fa-hourglass-half text-blue-500"></i> Inventory Aging</h2></div>
    <div class="flex gap-2">
      <button id="ia-copy" disabled class="bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-xs px-3 py-1.5 rounded border border-slate-700"><i class="fa-solid fa-copy"></i> Copy</button>
      <button id="ia-print" disabled class="bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-xs px-3 py-1.5 rounded border border-slate-700"><i class="fa-solid fa-print"></i> Print</button>
    </div>
  </div>

  <div class="bg-slate-800/60 border border-slate-700 rounded-xl p-4 space-y-3 no-print">
    <div class="grid grid-cols-2 md:grid-cols-6 gap-3">
      <div class="col-span-2"><label class="block text-xs font-medium text-slate-300 mb-1">Company</label><select id="ia-company" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm"><option value="">Select...</option></select></div>
      <div><label class="block text-xs font-medium text-slate-300 mb-1">Warehouse</label><select id="ia-warehouse" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm"><option value="">All</option></select></div>
      <div><label class="block text-xs font-medium text-slate-300 mb-1">Category</label><select id="ia-category" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm"><option value="">All</option></select></div>
      <div><label class="block text-xs font-medium text-slate-300 mb-1">As at</label><input type="date" id="ia-asof" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm"></div>
      <div class="flex items-end"><button id="ia-run" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium px-4 py-2 rounded-lg text-sm">Run</button></div>
    </div>
    <div class="flex flex-wrap items-center gap-4 text-xs text-slate-300">
      <input id="ia-search" placeholder="Search item" class="bg-slate-900 border border-slate-700 rounded-lg py-1.5 px-3 text-sm w-56">
      <label class="flex items-center gap-2"><input id="ia-qty" type="checkbox"> Show quantities, not values</label>
      <label class="flex items-center gap-2"><input id="ia-zero" type="checkbox"> Include items with no stock</label>
    </div>
    <div id="ia-error" class="hidden text-xs text-red-400 bg-red-500/10 border border-red-500/20 p-2.5 rounded-lg"></div>
  </div>

  <div id="ia-report" class="hidden space-y-3">
    <div class="flex flex-col md:flex-row md:justify-between gap-1">
      <div><p id="ia-company-name" class="text-xs text-slate-400 uppercase"></p><h3 class="text-lg font-bold" id="ia-title"></h3></div>
      <p id="ia-scope" class="text-sm text-slate-300 md:text-right"></p>
    </div>
    <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-x-auto">
      <table class="w-full text-left text-xs">
        <thead><tr id="ia-head" class="bg-slate-900 border-b border-slate-700 text-slate-400 uppercase"></tr></thead>
        <tbody id="ia-body" class="divide-y divide-slate-700"></tbody>
        <tfoot id="ia-foot" class="font-semibold border-t border-slate-600"></tfoot>
      </table>
    </div>
    <p class="text-xs text-slate-500">Stock is aged by receipt date, first in first out: the quantity on hand is taken to be the most recent receipts. A warehouse transfer keeps the stock's age. Values are at the moving average cost the books hold, split in proportion to the quantities.</p>
  </div>
</div>

<script>
(function () {
  // Inventory Aging (docs/modules/AGING_REPORTS.md, decisions 120-121).
  const $ = id => document.getElementById(id);
  const call = (name, data) => new Promise((ok, fail) => rpc.withSuccessHandler(ok).withFailureHandler(fail)[name](data));
  const money = n => (Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const qtyText = n => (Number(n) || 0).toLocaleString('en-US', { maximumFractionDigits: 4 });
  let report = null, loadedCompany = '', seq = 0; // only the latest Run draws (an older one answering late is dropped)

  function showError(msg) { $('ia-error').textContent = msg || ''; $('ia-error').classList.toggle('hidden', !msg); }
  function rows() {
    const q = $('ia-search').value.trim().toLowerCase();
    return report.Rows.filter(r => !q || (r.ItemCode + ' ' + r.ItemName).toLowerCase().includes(q));
  }
  function run() {
    showError('');
    const companyId = $('ia-company').value;
    if (!companyId) return showError('Select a Company.');
    $('ia-run').disabled = true;
    const mine = ++seq;
    call('getInventoryAging', { companyId, asOf: $('ia-asof').value, warehouseId: companyId === loadedCompany ? $('ia-warehouse').value : '',
      category: companyId === loadedCompany ? $('ia-category').value : '', onlyWithStock: !$('ia-zero').checked }).then(r => {
      if (mine !== seq) return;
      report = r;
      if (companyId !== loadedCompany) {
        loadedCompany = companyId;
        $('ia-warehouse').innerHTML = '<option value="">All</option>' + r.Warehouses.map(w => '<option value="' + escapeHtml(w.ID) + '">' + escapeHtml(w.Label) + '</option>').join('');
        $('ia-category').innerHTML = '<option value="">All</option>' + r.Categories.map(c => '<option>' + escapeHtml(c) + '</option>').join('');
      }
      render();
    }, err => { if (mine === seq) showError(err.message || 'Unable to run the report.'); }).then(() => { if (mine === seq) $('ia-run').disabled = false; });
  }
  function render() {
    const r = report, byQty = $('ia-qty').checked;
    $('ia-report').classList.remove('hidden');
    $('ia-copy').disabled = $('ia-print').disabled = false;
    $('ia-company-name').textContent = $('ia-company').selectedOptions[0].textContent;
    $('ia-title').textContent = 'Inventory Aging as at ' + r.AsOf;
    $('ia-scope').textContent = (r.WarehouseID ? $('ia-warehouse').selectedOptions[0].textContent : 'All warehouses') + (byQty ? ' · quantities' : ' · values') + ' · days since receipt';
    $('ia-head').innerHTML = '<th class="py-2 px-3">Item</th><th class="py-2 px-3">Category</th><th class="py-2 px-3 text-right">On hand</th><th class="py-2 px-3 text-right">Value</th>' +
      r.Buckets.map(b => '<th class="py-2 px-3 text-right">' + b.label + '</th>').join('') + '<th class="py-2 px-3">Last receipt</th><th class="py-2 px-3">Last issue</th>';
    const list = rows();
    const cell = (x, k) => { const v = byQty ? x.QtyBuckets[k] : x.Buckets[k]; return Math.abs(v) < 1e-9 ? '<span class="text-slate-600">—</span>' : (byQty ? qtyText(v) : money(v)); };
    $('ia-body').innerHTML = list.map(x => '<tr data-id="' + escapeHtml(x.ItemID) + '">' +
      '<td class="py-1.5 px-3">' + escapeHtml(x.ItemCode) + ' <span class="text-slate-500">' + escapeHtml(x.ItemName) + '</span>' + (x.Short > 1e-9 ? ' <span class="text-amber-300" title="More was issued than the receipts on record show; that part has no age">⚠</span>' : '') + '</td>' +
      '<td class="py-1.5 px-3">' + escapeHtml(x.Category) + '</td><td class="py-1.5 px-3 text-right">' + qtyText(x.Qty) + ' ' + escapeHtml(x.UOM) + '</td><td class="py-1.5 px-3 text-right font-mono ia-value">' + money(x.Value) + '</td>' +
      r.Buckets.map(b => '<td class="py-1.5 px-3 text-right font-mono ia-b-' + b.key + '">' + cell(x, b.key) + '</td>').join('') +
      '<td class="py-1.5 px-3">' + escapeHtml(x.LastIn) + '</td><td class="py-1.5 px-3">' + escapeHtml(x.LastOut) + '</td></tr>').join('') ||
      '<tr><td colspan="' + (r.Buckets.length + 6) + '" class="py-6 text-center text-slate-500">No stock.</td></tr>';
    $('ia-foot').innerHTML = byQty ? '' : '<tr><td class="py-2 px-3" colspan="3">Total (' + r.Rows.length + ' items)</td><td id="ia-total" class="py-2 px-3 text-right font-mono">' + money(r.Totals.Value) + '</td>' +
      r.Buckets.map(b => '<td class="py-2 px-3 text-right font-mono">' + money(r.Totals.Buckets[b.key]) + '</td>').join('') + '<td colspan="2"></td></tr>';
  }
  // Tab-separated, so a paste into Excel lands each field in its own cell.
  function copy() {
    const r = report;
    const lines = [['Item', 'Name', 'Category', 'On hand', 'UOM', 'Value'].concat(r.Buckets.map(b => b.label + ' (value)'), r.Buckets.map(b => b.label + ' (qty)'), ['Last receipt', 'Last issue'])]
      .concat(rows().map(x => [x.ItemCode, x.ItemName, x.Category, x.Qty, x.UOM, x.Value.toFixed(2)].concat(r.Buckets.map(b => x.Buckets[b.key].toFixed(2)), r.Buckets.map(b => x.QtyBuckets[b.key]), [x.LastIn, x.LastOut])));
    const tsv = lines.map(l => l.map(v => String(v).replace(/[\t\n]/g, ' ')).join('\t')).join('\n');
    const done = () => { $('ia-copy').innerHTML = '<i class="fa-solid fa-check"></i> Copied'; setTimeout(() => { $('ia-copy').innerHTML = '<i class="fa-solid fa-copy"></i> Copy'; }, 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(tsv).then(done, () => appAlert('Unable to copy.'));
    else appAlert('Copying is not available in this browser.');
  }

  window.initModule = function () {
    $('app-title').innerHTML = '<i class="fa-solid fa-hourglass-half"></i> Inventory Aging';
    $('ia-asof').value = new Date().toISOString().substring(0, 10);
    call('getActiveCompanies', {}).then(list => {
      (list || []).sort((a, b) => a.LegalName.localeCompare(b.LegalName)).forEach(c => {
        const o = document.createElement('option'); o.value = c.CompanyID; o.textContent = c.LegalName + (c.CompanyRefCode ? ' (' + c.CompanyRefCode + ')' : '');
        $('ia-company').appendChild(o);
      });
      if ($('ia-company').options.length === 2) { $('ia-company').selectedIndex = 1; run(); }
    }, err => showError(err.message || 'Unable to load companies.'));
    $('ia-run').addEventListener('click', run);
    $('ia-search').addEventListener('input', () => { if (report) render(); });
    $('ia-qty').addEventListener('change', () => { if (report) render(); });
    $('ia-copy').addEventListener('click', copy);
    $('ia-print').addEventListener('click', () => window.print());
  };
})();
</script>
