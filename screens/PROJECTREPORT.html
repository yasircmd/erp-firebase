<style>
  @media print {
    #back-to-tree-btn, #tree-controls, #user-menu, .no-print { display: none !important; }
    body, #app-container { background: white !important; color: black !important; }
  }
</style>

<!-- Project Report (owner, 2026-10-16; docs/modules/PROJECTS_DIMENSIONS.md):
     each project's income, costs and result for a period, by account. -->
<div class="space-y-6">
  <div class="flex items-center justify-between border-b border-slate-800 pb-4 no-print">
    <div><div class="text-xs font-semibold text-blue-400 uppercase mb-1">Financial Reports</div><h2 class="text-2xl font-bold"><i class="fa-solid fa-diagram-project text-blue-500"></i> Project Report</h2></div>
    <button id="pr-print-btn" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded border border-slate-700"><i class="fa-solid fa-print"></i> Print</button>
  </div>

  <div class="bg-slate-800/60 border border-slate-700 rounded-xl p-4 space-y-3 no-print">
    <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
      <div><label class="block text-xs font-medium text-slate-300 mb-1">Company</label><select id="pr-company" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm"><option value="">Select...</option></select></div>
      <div><label class="block text-xs font-medium text-slate-300 mb-1">From</label><input type="date" id="pr-from-date" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm"></div>
      <div><label class="block text-xs font-medium text-slate-300 mb-1">To</label><input type="date" id="pr-to-date" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm"></div>
      <div><label class="block text-xs font-medium text-slate-300 mb-1">Project</label><select id="pr-project" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm"><option value="">All</option><option value="__none__">No project</option></select></div>
      <div class="flex items-end gap-2">
        <button id="pr-run-btn" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-4 py-2 rounded-lg font-medium">Run Report</button>
        <button id="pr-copy-btn" class="bg-slate-700 hover:bg-slate-600 text-xs px-4 py-2 rounded-lg"><i class="fa-solid fa-copy"></i> Copy</button>
      </div>
    </div>
  </div>

  <div id="pr-error" class="hidden text-xs text-red-400 bg-red-500/10 border border-red-500/20 p-2.5 rounded-lg"></div>

  <div id="pr-results" class="hidden space-y-3">
    <h3 class="text-sm text-slate-400">For the period <span id="pr-period" class="text-slate-200 font-medium"></span> <span class="text-slate-500 no-print">— select a project to see its accounts</span></h3>
    <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden">
      <table class="w-full text-left text-sm">
        <thead><tr class="bg-slate-900 border-b border-slate-700 text-xs text-slate-400 uppercase">
          <th class="py-2 px-3">Project</th><th class="py-2 px-3">Customer</th><th class="py-2 px-3">Dates</th><th class="py-2 px-3">Status</th>
          <th class="py-2 px-3 text-right">Income</th><th class="py-2 px-3 text-right">Costs</th><th class="py-2 px-3 text-right">Result</th>
        </tr></thead>
        <tbody id="pr-body" class="divide-y divide-slate-700"></tbody>
        <tfoot id="pr-foot" class="font-medium border-t border-slate-600"></tfoot>
      </table>
    </div>
  </div>
</div>

<script>
(function () {
  let report = null, customers = [], openRows = new Set();
  const $ = id => document.getElementById(id);
  function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  const money = n => (Number(n) || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const showError = msg => { $('pr-error').textContent = msg || ''; $('pr-error').classList.toggle('hidden', !msg); };
  const customerName = id => { const c = customers.find(x => x.CustomerID === id); return c ? c.CustomerName : ''; };

  function run() {
    const params = { CompanyID: $('pr-company').value, FromDate: $('pr-from-date').value, ToDate: $('pr-to-date').value, ProjectID: $('pr-project').value };
    if (!params.CompanyID) return showError('Select a Company.');
    showError('');
    $('pr-run-btn').disabled = true;
    rpc.withSuccessHandler(r => { $('pr-run-btn').disabled = false; report = r; render(); })
      .withFailureHandler(err => { $('pr-run-btn').disabled = false; showError(err.message || 'Unable to run the report.'); })
      .getProjectReport({ params });
  }

  function render() {
    const r = report;
    $('pr-results').classList.remove('hidden');
    $('pr-period').textContent = r.fromDate + ' to ' + r.toDate;
    $('pr-body').innerHTML = r.projects.map(x => `
      <tr class="pr-row hover:bg-slate-700/30 cursor-pointer" data-id="${escapeHtml(x.ProjectID)}">
        <td class="py-2 px-3"><i class="fa-solid ${openRows.has(x.ProjectID) ? 'fa-chevron-down' : 'fa-chevron-right'} text-slate-500 text-[10px] mr-1 no-print"></i>${x.ProjectID ? '<span class="font-mono text-xs">' + escapeHtml(x.Code) + '</span> ' : ''}${escapeHtml(x.Name)}</td>
        <td class="py-2 px-3 text-xs text-slate-400">${escapeHtml(customerName(x.CustomerID))}</td>
        <td class="py-2 px-3 text-xs text-slate-400">${escapeHtml([x.StartDate, x.EndDate].filter(Boolean).join(' – '))}</td>
        <td class="py-2 px-3 text-xs">${escapeHtml(x.Status)}</td>
        <td class="py-2 px-3 text-right font-mono">${money(x.Income)}</td>
        <td class="py-2 px-3 text-right font-mono">${money(x.Costs)}</td>
        <td class="pr-result py-2 px-3 text-right font-mono font-semibold ${x.Result < 0 ? 'text-red-400' : ''}">${money(x.Result)}</td>
      </tr>` + (openRows.has(x.ProjectID) ? x.Accounts.map(a => `
      <tr class="pr-account text-xs bg-slate-900/40"><td class="py-1 px-3 pl-8 font-mono" colspan="4">${escapeHtml(a.AccountCode)} ${escapeHtml(a.AccountName)} <span class="text-slate-500">(${a.Kind === 'Income' ? 'income' : 'cost'})</span></td>
        <td class="py-1 px-3 text-right font-mono">${a.Kind === 'Income' ? money(a.Amount) : ''}</td><td class="py-1 px-3 text-right font-mono">${a.Kind === 'Costs' ? money(a.Amount) : ''}</td><td></td></tr>`).join('') : '')).join('') ||
      '<tr><td colspan="7" class="py-6 text-center text-slate-500">Nothing posted to income or cost accounts in this period.</td></tr>';
    const t = r.totals;
    $('pr-foot').innerHTML = `<tr><td class="py-2 px-3" colspan="4">Total</td><td class="py-2 px-3 text-right font-mono">${money(t.Income)}</td><td class="py-2 px-3 text-right font-mono">${money(t.Costs)}</td><td id="pr-total-result" class="py-2 px-3 text-right font-mono">${money(t.Result)}</td></tr>`;
  }

  // Tab-separated, so a paste into Excel lands each field in its own cell.
  function copy() {
    if (!report) return;
    const lines = [['Project', 'Name', 'Customer', 'Start', 'End', 'Status', 'Income', 'Costs', 'Result']]
      .concat(report.projects.map(x => [x.Code, x.Name, customerName(x.CustomerID), x.StartDate, x.EndDate, x.Status, x.Income.toFixed(2), x.Costs.toFixed(2), x.Result.toFixed(2)]));
    const tsv = lines.map(l => l.map(v => String(v == null ? '' : v).replace(/[\t\n]/g, ' ')).join('\t')).join('\n');
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(tsv).then(() => appAlert('Copied.'), () => appAlert('Unable to copy.'));
    else appAlert('Copying is not available in this browser.');
  }

  function fillProjects() {
    const co = $('pr-company').value, sel = $('pr-project'), keep = sel.value;
    sel.innerHTML = '<option value="">All</option><option value="__none__">No project</option>';
    (window.__prUnits || []).filter(u => u.Type === 'Project' && (!u.CompanyID || u.CompanyID === co))
      .sort((a, b) => String(a.Code).localeCompare(String(b.Code), undefined, { numeric: true }))
      .forEach(u => { const o = document.createElement('option'); o.value = u.UnitID; o.textContent = u.Code + ' — ' + u.Name; sel.appendChild(o); });
    if ([...sel.options].some(o => o.value === keep)) sel.value = keep;
  }

  window.initModule = function () {
    const today = new Date().toISOString().substring(0, 10);
    $('pr-from-date').value = today.substring(0, 4) + '-01-01';
    $('pr-to-date').value = today;
    rpc.withSuccessHandler(list => {
      (list || []).sort((a, b) => a.LegalName.localeCompare(b.LegalName)).forEach(c => { const o = document.createElement('option'); o.value = c.CompanyID; o.textContent = c.LegalName; $('pr-company').appendChild(o); });
      if ($('pr-company').options.length === 2) { $('pr-company').selectedIndex = 1; fillProjects(); }
    }).withFailureHandler(err => showError(err.message || 'Unable to load companies.')).getActiveCompanies();
    rpc.withSuccessHandler(units => { window.__prUnits = units || []; fillProjects(); }).withFailureHandler(() => {}).getActiveOrgUnits();
    rpc.withSuccessHandler(list => { customers = list || []; if (report) render(); }).withFailureHandler(() => {}).getActiveCustomers();
    $('pr-company').addEventListener('change', fillProjects);
    $('pr-run-btn').addEventListener('click', run);
    $('pr-copy-btn').addEventListener('click', copy);
    $('pr-print-btn').addEventListener('click', () => window.print());
    $('pr-body').addEventListener('click', e => {
      const row = e.target.closest('.pr-row');
      if (!row) return;
      const id = row.getAttribute('data-id');
      if (openRows.has(id)) openRows.delete(id); else openRows.add(id);
      render();
    });
  };
})();
</script>
