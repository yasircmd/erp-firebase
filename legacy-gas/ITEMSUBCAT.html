<div class="space-y-6">
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-4">
    <div><div class="text-xs font-semibold text-blue-400 uppercase mb-1">Stock Management</div><h2 class="text-2xl font-bold"><i class="fa-solid fa-tags text-blue-500"></i> Item Sub-Category</h2></div>
    <button id="isc-add-btn" class="hidden bg-blue-600 hover:bg-blue-500 text-white font-medium px-4 py-2 rounded-lg text-sm"><i class="fa-solid fa-plus"></i> Add Sub-Category</button>
  </div>

  <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-left">
        <thead><tr class="bg-slate-900 border-b border-slate-700 text-xs text-slate-400 uppercase">
          <th class="py-3 px-4">Name</th><th class="py-3 px-4">Parent Category</th><th class="py-3 px-4">Status</th><th class="py-3 px-4 text-right">Actions</th>
        </tr></thead>
        <tbody id="isc-table-body" class="divide-y divide-slate-700 text-sm"></tbody>
      </table>
    </div>
  </div>
</div>

<div id="isc-modal" class="fixed inset-0 bg-slate-950/80 hidden flex items-center justify-center p-4 z-50">
  <div class="bg-slate-800 border border-slate-700 rounded-xl w-full max-w-md p-6 shadow-2xl space-y-5">
    <div class="flex items-center justify-between border-b border-slate-700 pb-3"><h3 id="isc-modal-title" class="text-lg font-bold">Add Sub-Category</h3><button id="isc-modal-close" class="text-slate-400 hover:text-slate-200"><i class="fa-solid fa-xmark text-lg"></i></button></div>
    <form id="isc-form" class="space-y-4">
      <input type="hidden" id="isc-form-id">
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">Parent Category</label>
        <select id="isc-form-category" required class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm">
          <option value="">Select...</option>
          <option value="RawMaterial">Raw Material</option>
          <option value="SemiFinishedGood">Semi-Finished Good</option>
          <option value="FinishedGood">Finished Good</option>
          <option value="Consumable">Consumable</option>
          <option value="Scrap">Scrap</option>
        </select>
      </div>
      <div><label class="block text-xs font-medium text-slate-300 mb-1">Name</label><input type="text" id="isc-form-name" required placeholder="e.g. Metals" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm focus:outline-none focus:border-blue-500"></div>
      <div><label class="block text-xs font-medium text-slate-300 mb-1">Status</label><select id="isc-form-status" required class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm"><option value="Active">Active</option><option value="Inactive">Inactive</option></select></div>
      <div id="isc-form-error" class="hidden text-xs text-red-400 bg-red-500/10 border border-red-500/20 p-2.5 rounded-lg text-center"></div>
      <div class="flex justify-end gap-3 pt-3 border-t border-slate-700">
        <button type="button" id="isc-modal-cancel" class="px-4 py-2 bg-slate-700 rounded-lg text-xs">Cancel</button>
        <button type="submit" id="isc-save-btn" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded-lg text-xs text-white"><i class="fa-solid fa-floppy-disk"></i> Save</button>
      </div>
    </form>
  </div>
</div>

<script>
(function () {
  let token = '';
  let canWrite = false;
  let subCategories = [];

  const CATEGORY_LABELS = {
    RawMaterial: 'Raw Material', SemiFinishedGood: 'Semi-Finished Good', FinishedGood: 'Finished Good',
    Consumable: 'Consumable', Scrap: 'Scrap'
  };

  function escapeHtml(value) {
    const div = document.createElement('div');
    div.textContent = value == null ? '' : String(value);
    return div.innerHTML;
  }

  function fetchAndRender() {
    google.script.run
      .withSuccessHandler(result => { subCategories = result || []; renderTable(); })
      .withFailureHandler(err => alert(err.message || 'Unable to load sub-categories.'))
      .getItemSubCategories(token);
  }

  function renderTable() {
    const tbody = document.getElementById('isc-table-body');
    tbody.innerHTML = '';
    if (!subCategories.length) { tbody.innerHTML = '<tr><td colspan="4" class="py-6 text-center text-slate-500">No sub-categories configured yet.</td></tr>'; return; }

    subCategories.sort((a, b) => a.Name.localeCompare(b.Name)).forEach(s => {
      const row = document.createElement('tr'); row.className = 'hover:bg-slate-800/40';
      const actions = canWrite
        ? `<button class="isc-edit text-slate-400 hover:text-blue-400 p-1" title="Edit"><i class="fa-solid fa-pen-to-square"></i></button>
           <button class="isc-toggle text-slate-400 ${s.Status === 'Active' ? 'hover:text-red-400' : 'hover:text-emerald-400'} p-1" title="${s.Status === 'Active' ? 'Deactivate' : 'Reactivate'}"><i class="fa-solid ${s.Status === 'Active' ? 'fa-ban' : 'fa-rotate-left'}"></i></button>`
        : '';
      row.innerHTML = `
        <td class="py-3 px-4 text-slate-200">${escapeHtml(s.Name)}</td>
        <td class="py-3 px-4 text-xs text-slate-400">${escapeHtml(CATEGORY_LABELS[s.ParentCategory] || s.ParentCategory)}</td>
        <td class="py-3 px-4 text-xs">${s.Status === 'Active' ? '<span class="text-emerald-400">Active</span>' : '<span class="text-slate-500">Inactive</span>'}</td>
        <td class="py-3 px-4 text-right">${actions}</td>`;
      if (canWrite) {
        row.querySelector('.isc-edit').addEventListener('click', () => openModal(s.SubCategoryID));
        row.querySelector('.isc-toggle').addEventListener('click', () => toggleStatus(s));
      }
      tbody.appendChild(row);
    });
  }

  function openModal(subCategoryId) {
    const form = document.getElementById('isc-form');
    form.reset();
    document.getElementById('isc-form-error').classList.add('hidden');
    if (subCategoryId) {
      const s = subCategories.find(item => item.SubCategoryID === subCategoryId);
      if (!s) return;
      document.getElementById('isc-modal-title').textContent = 'Edit Sub-Category';
      document.getElementById('isc-form-id').value = s.SubCategoryID;
      document.getElementById('isc-form-category').value = s.ParentCategory;
      document.getElementById('isc-form-name').value = s.Name;
      document.getElementById('isc-form-status').value = s.Status;
    } else {
      document.getElementById('isc-modal-title').textContent = 'Add Sub-Category';
      document.getElementById('isc-form-id').value = '';
    }
    document.getElementById('isc-modal').classList.remove('hidden');
  }

  function closeModal() { document.getElementById('isc-modal').classList.add('hidden'); }

  function saveSubCategory(event) {
    event.preventDefault();
    const data = {
      SubCategoryID: document.getElementById('isc-form-id').value,
      ParentCategory: document.getElementById('isc-form-category').value,
      Name: document.getElementById('isc-form-name').value.trim(),
      Status: document.getElementById('isc-form-status').value
    };
    const error = document.getElementById('isc-form-error');
    const btn = document.getElementById('isc-save-btn');
    error.classList.add('hidden');
    btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> Saving...';
    google.script.run
      .withSuccessHandler(result => {
        btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Save';
        if (result.success) { closeModal(); fetchAndRender(); }
        else { error.textContent = result.error || 'Unable to save.'; error.classList.remove('hidden'); }
      })
      .withFailureHandler(err => {
        btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Save';
        error.textContent = err.message || 'Unable to save.'; error.classList.remove('hidden');
      })
      .saveItemSubCategory(token, data);
  }

  function toggleStatus(sub) {
    const deactivating = sub.Status === 'Active';
    if (!confirm((deactivating ? 'Deactivate' : 'Reactivate') + ' ' + sub.Name + '?')) return;
    const call = deactivating ? 'deactivateItemSubCategory' : 'reactivateItemSubCategory';
    google.script.run
      .withSuccessHandler(result => { if (result.success) fetchAndRender(); else alert(result.error || 'Unable to update.'); })
      .withFailureHandler(err => alert(err.message || 'Unable to update.'))
      [call](token, sub.SubCategoryID);
  }

  // Single entry point called by Index.html after this fragment is injected.
  window.initModule = function (idToken, writeAllowed) {
    token = idToken;
    canWrite = Boolean(writeAllowed);

    document.getElementById('isc-add-btn').classList.toggle('hidden', !canWrite);
    if (canWrite) document.getElementById('isc-add-btn').addEventListener('click', () => openModal());
    document.getElementById('isc-modal-close').addEventListener('click', closeModal);
    document.getElementById('isc-modal-cancel').addEventListener('click', closeModal);
    document.getElementById('isc-form').addEventListener('submit', saveSubCategory);

    document.getElementById('app-title').innerHTML = '<i class="fa-solid fa-tags"></i> Item Sub-Category';
    fetchAndRender();
  };
})();
</script>
