<style>
  @media print {
    #back-to-tree-btn, #tree-controls, #user-menu, .no-print { display: none !important; }
    body, #app-container { background: white !important; color: black !important; }
  }
</style>

<div class="space-y-6">
  <div class="flex items-center justify-between border-b border-slate-800 pb-4 no-print">
    <div class="flex items-center gap-3">
      <button id="sl-back-btn" class="hidden bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded border border-slate-700"><i class="fa-solid fa-arrow-left"></i> <span id="sl-back-label">Back</span></button>
      <div><div class="text-xs font-semibold text-blue-400 uppercase mb-1">Stock Reports</div><h2 class="text-2xl font-bold"><i class="fa-solid fa-book-open text-blue-500"></i> Stock Ledger Report</h2></div>
    </div>
    <button id="sl-print-btn" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded border border-slate-700"><i class="fa-solid fa-print"></i> Print</button>
  </div>

  <div class="bg-slate-800/60 border border-slate-700 rounded-xl p-4 space-y-3 no-print">
    <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
      <div><label class="block text-xs font-medium text-slate-300 mb-1">Company</label><select id="sl-company" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm"></select></div>
      <div class="md:col-span-2">
        <label class="block text-xs font-medium text-slate-300 mb-1">Item</label>
        <input type="text" id="sl-item-input" list="sl-item-datalist" placeholder="Type an item code or name" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm">
      </div>
      <div><label class="block text-xs font-medium text-slate-300 mb-1">Warehouse / Rack</label><select id="sl-location" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm"><option value="">Select...</option></select></div>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
      <div><label class="block text-xs font-medium text-slate-300 mb-1">From</label><input type="date" id="sl-from-date" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm"></div>
      <div><label class="block text-xs font-medium text-slate-300 mb-1">To</label><input type="date" id="sl-to-date" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm"></div>
      <div class="md:col-span-2 flex items-end gap-2">
        <button id="sl-copy-btn" class="bg-slate-700 hover:bg-slate-600 text-xs px-4 py-2 rounded-lg"><i class="fa-solid fa-copy"></i> Copy Table</button>
        <button id="sl-run-btn" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-4 py-2 rounded-lg font-medium">Run Report</button>
      </div>
    </div>
  </div>

  <div id="sl-error" class="hidden text-xs text-red-400 bg-red-500/10 border border-red-500/20 p-2.5 rounded-lg"></div>

  <div id="sl-results" class="hidden space-y-3">
    <div class="flex items-center justify-between">
      <h3 id="sl-item-title" class="text-lg font-semibold text-slate-200"></h3>
      <span id="sl-location-label" class="text-xs text-slate-500"></span>
    </div>
    <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left">
          <thead>
            <tr class="bg-slate-900 border-b border-slate-700 text-xs text-slate-400 uppercase">
              <th class="py-3 px-4">Date</th>
              <th class="py-3 px-4">Voucher No.</th>
              <th class="py-3 px-4">Type</th>
              <th class="py-3 px-4">Description</th>
              <th class="py-3 px-4 text-right">In</th>
              <th class="py-3 px-4 text-right">Out</th>
              <th class="py-3 px-4 text-right">Balance Qty</th>
              <th class="py-3 px-4 text-right">Avg Cost</th>
              <th class="py-3 px-4 text-right">Balance Value</th>
            </tr>
          </thead>
          <tbody id="sl-table-body" class="divide-y divide-slate-700 text-sm">
            <tr><td class="py-3 px-4 text-slate-400 italic" colspan="6">Opening Balance</td><td class="py-3 px-4 text-right font-mono" id="sl-opening-qty"></td><td></td><td class="py-3 px-4 text-right font-mono" id="sl-opening-value"></td></tr>
          </tbody>
          <tfoot>
            <tr class="bg-slate-900 border-t border-slate-700 font-medium text-sm">
              <td class="py-2 px-4" colspan="6">Closing Balance</td>
              <td class="py-2 px-4 text-right font-mono" id="sl-closing-qty"></td>
              <td></td>
              <td class="py-2 px-4 text-right font-mono" id="sl-closing-value"></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>
    <p class="text-xs text-slate-500 no-print">Click a Voucher No. to open that entry.</p>
  </div>
</div>

<datalist id="sl-item-datalist"></datalist>

<script>
(function () {
  let token = '';
  let items = [];
  let companies = [];
  let orgUnits = [];
  let lastReport = null;
  let myReturnChain = [];

  function escapeHtml(value) {
    const div = document.createElement('div');
    div.textContent = value == null ? '' : String(value);
    return div.innerHTML;
  }
  function formatMoney(n) {
    const num = Number(n) || 0;
    return num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function fmt(n) { return (Number(n) || 0).toFixed(2); }
  function today() { return new Date().toISOString().substring(0, 10); }
  function firstOfMonth() { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1).toISOString().substring(0, 10); }

  function itemByCode(code) {
    const clean = String(code || '').split(' — ')[0].trim();
    return items.find(i => i.ItemCode === clean);
  }

  // Same rack-aware grouped location list used across every stock
  // module — a rack's balance is tracked entirely separately from its
  // parent warehouse's own balance, so both need to be selectable here.
  function populateLocationSelect() {
    const select = document.getElementById('sl-location');
    select.innerHTML = '<option value="">Select...</option>';
    orgUnits.filter(u => u.Type === 'Warehouse' || u.Type === 'Rack')
      .sort((a, b) => {
        const aParent = a.Type === 'Rack' ? a.ParentUnitID : a.UnitID;
        const bParent = b.Type === 'Rack' ? b.ParentUnitID : b.UnitID;
        if (aParent !== bParent) return String(aParent || '').localeCompare(String(bParent || ''));
        if (a.Type !== b.Type) return a.Type === 'Warehouse' ? -1 : 1;
        return String(a.Code).localeCompare(String(b.Code), undefined, { numeric: true });
      })
      .forEach(u => {
        let label = u.Code;
        if (u.Type === 'Rack') {
          const parentWh = orgUnits.find(w => w.UnitID === u.ParentUnitID);
          label = (parentWh ? parentWh.Code : '?') + ' / ' + u.Code;
        }
        const opt = document.createElement('option');
        opt.value = u.UnitID; opt.textContent = label;
        select.appendChild(opt);
      });
  }

  function populateItemDatalist() {
    const companyId = document.getElementById('sl-company').value;
    // Same client-side company scoping every stock entry module uses —
    // getActiveItems returns everything the USER can access, not
    // filtered to one company, so that's done here.
    const filtered = items.filter(i => !i.CompanyID || i.CompanyID === companyId);
    const list = document.getElementById('sl-item-datalist');
    list.innerHTML = '';
    filtered.forEach(i => {
      const opt = document.createElement('option');
      opt.value = i.ItemCode + ' — ' + i.ItemName;
      list.appendChild(opt);
    });
  }

  function loadReferenceData() {
    google.script.run
      .withSuccessHandler(result => {
        companies = result || [];
        const select = document.getElementById('sl-company');
        select.innerHTML = '<option value="">Select...</option>';
        companies.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.CompanyID; opt.textContent = c.LegalName;
          select.appendChild(opt);
        });
        populateItemDatalist();
      })
      .withFailureHandler(err => console.error(err))
      .getActiveCompanies(token);

    google.script.run
      .withSuccessHandler(result => { orgUnits = result || []; populateLocationSelect(); })
      .withFailureHandler(err => console.error(err))
      .getActiveOrgUnits(token);

    google.script.run
      .withSuccessHandler(result => { items = result || []; populateItemDatalist(); })
      .withFailureHandler(err => console.error(err))
      .getActiveItems(token);
  }

  function runReport() {
    const error = document.getElementById('sl-error');
    error.classList.add('hidden');
    document.getElementById('sl-results').classList.add('hidden');

    const item = itemByCode(document.getElementById('sl-item-input').value);
    if (!item) { error.textContent = 'Select a valid item.'; error.classList.remove('hidden'); return; }
    const warehouseId = document.getElementById('sl-location').value;
    if (!warehouseId) { error.textContent = 'Select a warehouse or rack.'; error.classList.remove('hidden'); return; }
    const fromDate = document.getElementById('sl-from-date').value;
    const toDate = document.getElementById('sl-to-date').value;
    if (!fromDate || !toDate) { error.textContent = 'Select a date range.'; error.classList.remove('hidden'); return; }

    const params = { ItemID: item.ItemID, WarehouseID: warehouseId, FromDate: fromDate, ToDate: toDate };

    const btn = document.getElementById('sl-run-btn');
    btn.disabled = true; const original = btn.textContent; btn.textContent = 'Running...';
    google.script.run
      .withSuccessHandler(result => {
        btn.disabled = false; btn.textContent = original;
        lastReport = result;
        renderReport(result);
      })
      .withFailureHandler(err => {
        btn.disabled = false; btn.textContent = original;
        error.textContent = err.message || 'Unable to run report.'; error.classList.remove('hidden');
      })
      .getStockLedgerReport(token, params);
  }

  // Opens the source stock transaction for a row — SourceModule is
  // resolved server-side from the transaction's own type, same pattern
  // GL Report uses for its own drill-through.
  function openSourceEntry(jvId, sourceModule) {
    if (!sourceModule) return; // shouldn't happen for a stock-originated row, but guard anyway
    const chainEntry = { moduleId: 'STOCKLEDGER', label: 'Stock Ledger Report', params: null };
    openModule(sourceModule, { OpenEntryId: jvId }, [...myReturnChain, chainEntry]);
  }

  function renderReport(result) {
    document.getElementById('sl-results').classList.remove('hidden');
    document.getElementById('sl-item-title').textContent = result.ItemCode + ' — ' + result.ItemName;
    const locSelect = document.getElementById('sl-location');
    document.getElementById('sl-location-label').textContent = locSelect.options[locSelect.selectedIndex].textContent;

    document.getElementById('sl-opening-qty').textContent = formatMoney(result.OpeningQuantity);
    document.getElementById('sl-opening-value').textContent = formatMoney(result.OpeningValue);

    const tbody = document.getElementById('sl-table-body');
    const openingRow = tbody.rows[0];
    tbody.innerHTML = '';
    tbody.appendChild(openingRow);

    if (!result.Rows.length) {
      const tr = document.createElement('tr');
      tr.innerHTML = '<td class="py-4 px-4 text-center text-slate-500" colspan="9">No activity in this period.</td>';
      tbody.appendChild(tr);
    }
    result.Rows.forEach(r => {
      const inQty = r.Direction === 'In' ? r.Quantity : 0;
      const outQty = r.Direction === 'Out' ? r.Quantity : 0;
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="py-2 px-4 text-xs text-slate-400">${escapeHtml(r.TransactionDate)}</td>
        <td class="py-2 px-4 font-mono text-xs"><button class="sl-open-entry underline decoration-dotted hover:text-blue-400 text-slate-200">${escapeHtml(r.TransactionNumber)}</button></td>
        <td class="py-2 px-4 text-xs text-slate-400">${escapeHtml(r.TransactionType)}</td>
        <td class="py-2 px-4 text-slate-200">${escapeHtml(r.Description)}</td>
        <td class="py-2 px-4 text-right text-xs">${inQty ? formatMoney(inQty) : ''}</td>
        <td class="py-2 px-4 text-right text-xs">${outQty ? formatMoney(outQty) : ''}</td>
        <td class="py-2 px-4 text-right text-xs font-mono">${formatMoney(r.RunningQuantity)}</td>
        <td class="py-2 px-4 text-right text-xs font-mono text-slate-500">${formatMoney(r.RunningAvgCost)}</td>
        <td class="py-2 px-4 text-right text-xs font-mono">${formatMoney(r.RunningValue)}</td>`;
      const openBtn = tr.querySelector('.sl-open-entry');
      if (r.SourceModule) openBtn.addEventListener('click', () => openSourceEntry(r.LinkedJVID || r.TransactionNumber, r.SourceModule));
      tbody.appendChild(tr);
    });

    document.getElementById('sl-closing-qty').textContent = formatMoney(result.ClosingQuantity);
    document.getElementById('sl-closing-value').textContent = formatMoney(result.ClosingValue);
  }

  function copyTable() {
    if (!lastReport) { alert('Run the report first.'); return; }
    const rows = [['Date', 'Voucher No.', 'Type', 'Description', 'In', 'Out', 'Balance Qty', 'Avg Cost', 'Balance Value'].join('\t')];
    rows.push(['', '', '', 'Opening Balance', '', '', fmt(lastReport.OpeningQuantity), '', fmt(lastReport.OpeningValue)].join('\t'));
    lastReport.Rows.forEach(r => {
      const inQty = r.Direction === 'In' ? r.Quantity : 0;
      const outQty = r.Direction === 'Out' ? r.Quantity : 0;
      rows.push([r.TransactionDate, r.TransactionNumber, r.TransactionType, r.Description, inQty ? fmt(inQty) : '', outQty ? fmt(outQty) : '', fmt(r.RunningQuantity), fmt(r.RunningAvgCost), fmt(r.RunningValue)].join('\t'));
    });
    const text = rows.join('\n');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(() => window.prompt('Copy this text:', text));
    } else {
      window.prompt('Copy this text:', text);
    }
  }

  function goBackInChain() {
    const chain = myReturnChain.slice();
    const target = chain.pop();
    if (!target) return;
    openModule(target.moduleId, target.params, chain);
  }

  window.initModule = function (idToken) {
    token = idToken;
    document.getElementById('sl-from-date').value = firstOfMonth();
    document.getElementById('sl-to-date').value = today();

    myReturnChain = window.__pendingReturnChain || [];
    window.__pendingReturnChain = [];
    if (myReturnChain.length) {
      const target = myReturnChain[myReturnChain.length - 1];
      document.getElementById('sl-back-label').textContent = 'Back to ' + (target.label || target.moduleId);
      document.getElementById('sl-back-btn').classList.remove('hidden');
      document.getElementById('sl-back-btn').addEventListener('click', goBackInChain);
    }

    loadReferenceData();

    document.getElementById('sl-company').addEventListener('change', populateItemDatalist);
    document.getElementById('sl-run-btn').addEventListener('click', runReport);
    document.getElementById('sl-copy-btn').addEventListener('click', copyTable);
    document.getElementById('sl-print-btn').addEventListener('click', () => window.print());

    document.getElementById('app-title').innerHTML = '<i class="fa-solid fa-book-open"></i> Stock Ledger Report';
  };
})();
</script>
